<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&family=VT323&display=swap">
<style>
/*
 * A dispatcher's console in pixel art: the map is the window, the side rack holds
 * the paperwork, the ticker runs underneath. Every frame, button and input wears a
 * nine-slice sprite drawn at boot (art.ts installTheme); pixel fonts sit at their
 * native sizes (Press Start 2P 8/16 px, VT323 20/40 px) so no glyph ever blurs.
 */
:root {
  --ink0: #090c17; --ink1: #10172a; --ink2: #1a2340; --ink3: #283659; --steel: #45587c; --fog: #7b8db0; --mist: #b6c4dc;
  --paper: #ece4cf; --white: #fbf7ea; --amber: #f4a83c; --amberD: #c96a26; --gold: #ffd96a; --rust: #9b3c26; --red: #d84a3a;
  --lime: #a9dc62; --cyan: #7fdcea; --teal: #2f7f86; --seaD: #112640;
  --display: "Press Start 2P", ui-monospace, Menlo, monospace;
  --body: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --data: "VT323", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ink1) var(--asphalt, none) repeat; color: var(--paper); font-family: var(--body); font-size: 16px; line-height: 1.4; image-rendering: pixelated; -webkit-font-smoothing: antialiased; }
#app { min-height: 100%; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 12px; }
button, input, select { font: inherit; color: inherit; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
img.px { image-rendering: pixelated; vertical-align: middle; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Type: the display face only at 8 and 16 px, the data face only at 20 and 40. */
.num { font-family: var(--data); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.num.big { font-size: 40px; }
.label { font-family: var(--display); font-size: 8px; line-height: 2; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fog); }
h1, h2, h3 { font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-size: 16px; line-height: 1.6; color: var(--amber); text-shadow: 2px 2px 0 var(--ink0); }
h3 { font-family: var(--body); font-weight: 600; font-size: 18px; line-height: 1.3; color: var(--white); }
p { margin: 0; }
.muted { color: var(--fog); }
.good { color: var(--lime); }
.bad { color: var(--red); }
.warn { color: var(--amber); }
.stars { color: var(--gold); letter-spacing: 1px; }
a { color: var(--cyan); }

/* Frames: nine-slice sprites from art.ts, 2 screen pixels per art pixel. */
.panel { border: 12px solid transparent; border-image: var(--f-panel, none) 12 fill / 12px; background: var(--ink2); padding: 4px 6px; }
.hud { border: 8px solid transparent; border-image: var(--f-hud, none) 8 fill / 8px; background: var(--ink2); padding: 2px 6px; }
.card { border: 8px solid transparent; border-image: var(--f-card, none) 8 fill / 8px; background: var(--ink1); padding: 4px 6px; display: grid; gap: 8px; }
.card.sel { border-image-source: var(--f-cardSel); }
.card.alert { border-image-source: var(--f-cardAlert); }
.card.alert h3 { color: var(--red); }
.btn { border: 6px solid transparent; border-image: var(--f-btn, none) 6 fill / 6px; background: var(--ink3); padding: 3px 6px; min-height: 32px; cursor: pointer; font-family: var(--display); font-size: 8px; line-height: 2; letter-spacing: 0.06em; text-transform: uppercase; color: var(--paper); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-image-source: var(--f-btnHover); background: var(--steel); }
.btn:active { border-image-source: var(--f-btnDown); background: var(--ink2); transform: translateY(1px); }
.btn.primary, .btn.on { border-image-source: var(--f-btnPrimary); background: var(--amber); color: var(--ink0); }
.btn.primary:hover, .btn.on:hover { border-image-source: var(--f-btnPrimaryHover); background: var(--gold); }
.btn.primary:active, .btn.on:active { border-image-source: var(--f-btnPrimaryDown); background: var(--amberD); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; filter: saturate(0.4); }
.btn[disabled]:hover { border-image-source: var(--f-btn); background: var(--ink3); }
.btn.primary[disabled]:hover { border-image-source: var(--f-btnPrimary); background: var(--amber); }
input[type=text], input[type=number], select { border: 6px solid transparent; border-image: var(--f-input, none) 6 fill / 6px; background: var(--ink0); padding: 2px 4px; min-width: 0; min-height: 32px; }
input[type=number] { width: 6.5em; font-family: var(--data); font-size: 20px; }
select { font-size: 15px; }
input[type=checkbox], input[type=radio] { accent-color: var(--amber); width: 16px; height: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.bar { height: 8px; background: var(--ink0); border: 2px solid var(--ink3); width: 90px; }
.bar > i { display: block; height: 100%; }
.field { display: grid; gap: 2px; }

/* Title screen: the road scene with the logo painted into it. */
#title { display: grid; gap: 14px; justify-items: center; padding-top: 4px; }
#titleCanvas { max-width: 100%; height: auto; border: 12px solid transparent; border-image: var(--f-map, none) 12 / 12px; background: var(--ink0); }
.tagline { font-family: var(--display); font-size: 8px; line-height: 2; color: var(--mist); letter-spacing: 0.12em; text-align: center; text-transform: uppercase; }
.menu { width: min(100%, 680px); display: grid; gap: 12px; }
.menu p, .menu .choice span { font-size: 16px; }
.choice { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 4px 6px; border: 8px solid transparent; border-image: var(--f-choice, none) 8 fill / 8px; background: var(--ink1); cursor: pointer; }
.choice:has(input:checked) { border-image-source: var(--f-choiceOn); }
#loading .stack { align-items: center; padding-top: 14vh; }
#loadCanvas { width: min(100%, 960px); height: auto; border: 12px solid transparent; border-image: var(--f-map, none) 12 / 12px; background: var(--ink1); }

/* Game screen. */
#game { display: grid; gap: 10px; }
.hud { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; }
.hud .clock { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hud .clock .num { color: var(--gold); }
.hud .stats { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.stat { display: flex; gap: 6px; align-items: center; }
.speeds { display: flex; gap: 3px; }
.speeds .btn { padding: 3px 4px; min-width: 38px; }
.badge { font-family: var(--display); font-size: 8px; line-height: 1; letter-spacing: 0.08em; padding: 6px 8px; border: 2px solid var(--ink0); box-shadow: inset 2px 2px 0 rgba(255,255,255,0.14), inset -2px -2px 0 rgba(0,0,0,0.3); }
.badge.live { background: var(--red); color: var(--white); }
.badge.test { background: var(--gold); color: var(--ink0); }
.badge.watch { background: var(--ink3); color: var(--mist); }
.badge.alert { background: var(--red); color: var(--white); }
@media (prefers-reduced-motion: no-preference) { .badge.live { animation: pulse 2s steps(2, end) infinite; } }
@keyframes pulse { 50% { background: var(--rust); } }
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 500px); gap: 12px; align-items: start; }
.mapwrap { position: relative; height: clamp(380px, calc(100vh - 180px), 1000px); border: 12px solid transparent; border-image: var(--f-map, none) 12 / 12px; background: var(--seaD); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.mapzoom { position: absolute; right: 6px; top: 6px; z-index: 2; display: flex; gap: 3px; align-items: center; background: rgba(9,12,23,0.8); border: 2px solid var(--ink3); padding: 3px; }
.mapzoom .btn { padding: 3px 4px; min-width: 32px; }
.mapzoom .label { min-width: 3.2em; text-align: center; color: var(--mist); }
#tip { position: absolute; z-index: 3; pointer-events: none; border: 6px solid transparent; border-image: var(--f-tip, none) 6 fill / 6px; background: var(--ink0); padding: 2px 4px; font-size: 15px; white-space: nowrap; }
.maplegend { position: absolute; left: 6px; bottom: 6px; z-index: 2; display: flex; gap: 12px; font-family: var(--display); font-size: 8px; line-height: 1; color: var(--mist); background: rgba(9,12,23,0.8); border: 2px solid var(--ink3); padding: 6px 8px; }
.dot { display: inline-block; width: 8px; height: 6px; margin-right: 5px; vertical-align: middle; border: 1px solid var(--ink0); }
.side { display: flex; flex-direction: column; gap: 8px; min-width: 0; container-type: inline-size; }
.tabs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.tabs .btn { flex-direction: column; gap: 2px; padding: 4px 0; min-height: 48px; letter-spacing: 0; overflow: hidden; }
.tabs .btn img { display: block; }
@container (max-width: 480px) { .tabs .btn span { display: none; } .tabs .btn { min-height: 40px; } }
#panel { max-height: clamp(380px, calc(100vh - 180px), 1000px); overflow: auto; min-height: 200px; scrollbar-color: var(--ink3) var(--ink0); }
#panel::-webkit-scrollbar { width: 12px; }
#panel::-webkit-scrollbar-track { background: var(--ink0); }
#panel::-webkit-scrollbar-thumb { background: var(--ink3); border: 2px solid var(--ink0); }
.truckhead { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 15px; }
.kv dt { color: var(--fog); }
.kv dd { margin: 0; }
.loads { display: grid; gap: 6px; }
.load { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 4px 6px; border: 8px solid transparent; border-image: var(--f-load, none) 8 fill / 8px; background: var(--ink1); }
.load.mine { border-image-source: var(--f-cardMine); }
.lane { font-family: var(--display); font-size: 8px; line-height: 2; letter-spacing: 0.06em; }
.lane .arrow { color: var(--amber); }
.ticker { display: flex; gap: 24px; overflow: hidden; white-space: nowrap; align-items: center; min-height: 40px; border: 8px solid transparent; border-image: var(--f-ticker, none) 8 fill / 8px; background: var(--ink0); padding: 0 6px; font-family: var(--data); font-size: 20px; line-height: 1; color: var(--amber); }
.ticker span { flex: none; }
.ticker .good { color: var(--lime); }
.ticker .bad { color: var(--red); }
.ticker .warn { color: var(--gold); }
.ticker .muted { color: var(--fog); }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); border: 8px solid transparent; border-image: var(--f-toast, none) 8 fill / 8px; background: var(--ink0); padding: 4px 6px; max-width: min(380px, calc(100vw - 32px)); z-index: 20; font-size: 16px; }
.toast.err { border-image-source: var(--f-toastErr); }
.spark { display: block; width: 100%; height: 48px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
td, th { text-align: left; padding: 4px 6px; border-bottom: 2px solid var(--ink2); }
th { font-family: var(--display); font-size: 8px; line-height: 1.6; color: var(--fog); font-weight: 400; letter-spacing: 0.06em; }
tr.you td { color: var(--cyan); }
.guide ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }
.guide p { margin: 0; font-size: 15px; }
.guide h4 { margin: 4px 0 0; font-family: var(--display); font-weight: 400; font-size: 8px; line-height: 2; color: var(--amber); letter-spacing: 0.06em; }
.guidenav { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.guidenav .label { width: 100%; }
.progress { width: min(100%, 420px); height: 14px; border: 2px solid var(--ink3); background: var(--ink0); }
.progress > i { display: block; height: 100%; background: var(--amber); width: 0; }
@media (max-width: 1240px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .mapwrap { height: auto; aspect-ratio: 16 / 10; }
  #panel { max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</div>

) and down when there's plenty, within \xD7${A.dealerPrices.range[0]}\u2013${A.dealerPrices.range[1]} of list. Used values move with new prices. Buying into a boom costs more.`)+DA("Delivery and supply")+V([`You pay when you order. The truck arrives ${C.baseDays} days later, plus a day for every ${U(1/C.daysPerPendingOrder)} trucks already on order nationally (up to ${C.maxDays}). Orders placed in a boom often land as it turns.`,`Supply is capped: ${U(A.tractors.workhorse.pocCap)} Workhorses, ${U(A.tractors.highwayPro.pocCap)} Highway Pros and ${U(A.tractors.flagship.pocCap)} Flagships in the whole world. ${K(A.starterReserveShare)} of Workhorses and dry vans are held for companies buying their first truck.`,`Ordering a first truck while on the NPC lease replaces the lease when it arrives. A company can run up to ${A.company.maxTrucks} trucks.`])},{id:"used",section:gC,title:"The used market",html:S(`List an idle owned truck at an asking price, a floor, and a weekly price cut; a buyer gets it today, where it stands. The seller gets ${K(1-A.usedMarket.feePct)} and ${K(A.usedMarket.feePct)} is burned.`)+S(`A truck's value falls with mileage (to ${K(A.depreciation.floorPct)} of new at ${U(A.depreciation.lifetimeMiles)} miles), ${K(A.depreciation.perYear)} a year with age, and up to ${K(A.depreciation.conditionWeight)} more for wear, all against what the same truck costs new today.`)},{id:"finance",section:gC,title:"Equipment Finance",html:V([`<b>Borrow</b> up to ${K(B.maxLoanToValue)} of an owned truck's value at ${K(B.weeklyRate)} a week, repaid over ${B.termWeeks} weeks.`,`<b>Miss ${B.missedPaymentsToRepossess} payments</b> and the truck is repossessed and sold; depositors absorb any shortfall.`,"<b>Deposit</b> spare FD to earn the interest borrowers pay. Idle cash in the pool pays the holding cost like any other."])},{id:"overhead",section:gC,title:"Overhead and parking",html:S("Running a fleet costs more than its trucks. Each week every truck past your third pays overhead by bracket:")+tA(["Truck number","FD a week each"],A.fleetOverhead.brackets.map((r,Q,t)=>[`${r.fromTruck}${t[Q+1]?`\u2013${t[Q+1].fromTruck-1}`:"+"}`,U(r.weeklyFd)]))+S(`A <b>parked</b> truck is off the road: no overhead, no insurance, no driver needed, but it still pays yard rent, and an owned truck unused for ${A.costs.idleFeeAfterDays}+ days pays ${A.costs.idleFeePerDay} FD a day. Dispatcher pay and yard rent are on top (${BA("dispatchers","Dispatchers")}, ${BA("home","Choosing a home hub")}).`)},{id:"facilities",section:gC,title:"Facilities: becoming a shipper",html:S(`Any company can buy a facility and post its own freight. The NPC market buys the goods on delivery; you pay the carrier and keep the margin, plus ${A.facilities.shipperMilesPerMile} Miles per mile shipped.`)+tA(["","Price","Upkeep/week","Loads/round","Freight"],["warehouse","coldStorage","factory"].map(r=>{let Q=A.facilities.types[r];return[r==="coldStorage"?"Cold storage":r[0].toUpperCase()+r.slice(1),`${U(Q.priceFd)} FD`,`${U(Q.upkeepPerWeekFd)} FD`,Q.loadsPerRound,Q.equipment==="bySector"?"by the hub's industry":Q.equipment]}))+S(`Your freight takes over part of the hub's NPC demand (NPCs always keep at least ${K(1-A.facilities.maxPlayerShareOfHub)}). Freight nobody hauls after ${A.facilities.expediteAfterRounds} rounds goes to an NPC expediter at the ceiling plus ${K(A.facilities.expeditePremium-1)}, at your cost. Up to ${A.facilities.maxPerCompany} facilities per company.`)}]}var vg="The market";function HQ(A){let g=A.board,C=A.rates,[B,e]=A.time.boardRoundHours;return[{id:"board",section:vg,title:"The load board",html:S(`Freight is sold in sealed-bid rounds at ${String(B).padStart(2,"0")}:00 and ${e}:00. Each load has a <b>ceiling</b>, the most its poster will pay per mile. You bid at or under it; nobody sees anyone else's bid.`)+DA("How a round clears")+V([`Every bid gets a score: ${K(g.scoreWeights.price)} for price (how far under the ceiling), ${K(g.scoreWeights.reputation)} for reputation (your on-time record), ${K(g.scoreWeights.deadhead)} for empty miles to the pickup (none is best; at ${g.deadheadScaleMi} it scores zero and past that it counts against you).`,"Bids clear best score first. A truck wins at most one load a round, and a load goes to one truck.",`A load nobody takes rolls to the next round with its ceiling up ${K(g.rolloverCeilingStep)}. After ${g.npcFallbackAfterRounds} rounds an NPC carrier takes NPC freight; a player shipper's freight goes to an NPC expediter at its cost.`])+DA("Bidding by hand")+V([`Pick an idle truck and a load up to ${lg} miles away with the right trailer. One bid per truck per round; you can rebid or withdraw until it clears.`,"A hand bid replaces your dispatcher's bids for that truck that round.",`The board shows your break-even for each load: fuel, wages, maintenance, insurance, expected repairs, the lessor's cut, the empty miles to the pickup, and the empty miles you'll likely run after delivering (${BA("reload","reload odds")}).`])+S(`Posters pay a ${K(g.posterFeePct)} board fee on what the freight pays them. Carriers pay nothing to bid.`)},{id:"booknow",section:vg,title:"Book-now prices",html:S("Every load also shows a <b>book-now</b> price. Take it and the load is yours at once, no round to wait for. Bid under it and you wait for the round; nobody ever pays more than the book-now, so a bid above it just takes the load at the book-now.")+DA("How posters set it")+V([`It opens as a share of the reference rate set by the load-to-truck ratio at the origin: about ${K(A.bookNow.openAtRatio[0][1])} where trucks pile up (ratio ${A.bookNow.openAtRatio[0][0]}), ${K(A.bookNow.openAtRatio[1][1])} at a balanced ${A.bookNow.openAtRatio[1][0]}, ${K(A.bookNow.openAtRatio[2][1])} when trucks are scarce (ratio ${A.bookNow.openAtRatio[2][0]}), never above the ceiling.`,`Each round a load sits unfilled the poster raises it ${K(A.bookNow.stepPerRound)}, up to the ceiling (which rises ${K(A.board.rolloverCeilingStep)} a round). Brokers fish: they open low where they can and pay up when nobody bites.`,"So a carrier that can wait makes the poster come up, and a carrier that has to move takes what's posted. In a truck-heavy market the book-now is cheap and rising; in a tight one it opens near the ceiling."])+DA("Your dispatcher and book-now")+S(`The standing order "Book loads between rounds" takes a load whenever its book-now clears your break-even plus a margin. The margin shrinks with <b>desperation</b>: a truck idle ${A.bookNow.desperation.idleHours} hours, or a driver more than ${A.bookNow.desperation.awayAfterDays} days from home, will take anything that covers costs. A truck sitting at home is half as pressed. Dispatchers look every ${A.bookNow.autoEveryHours} hours.`)},{id:"rates",section:vg,title:"How shippers price freight",html:S(`NPC shippers post at a reference rate. It starts from the lane's base rate: ${C.baseRatePerMile.toFixed(2)} FD/mi for a dry van, plus ${C.shortHaulBonus} FD \xF7 miles on short hauls. Then it's multiplied by:`)+V([`<b>Tightness:</b> the load-to-truck ratio within ${A.map.nearbyRadiusMi} miles of the origin for that trailer type, to the power ${C.ratioExponent} (kept within ${C.ratioClamp[0]}\u2013${C.ratioClamp[1]}). Idle trucks that wouldn't take today's rates don't count as supply.`,"<b>Weather</b> at the origin.",`<b>Trailer:</b> reefer \xD7${C.equipmentPremium.reefer}, flatbed \xD7${C.equipmentPremium.flatbed}.`,`<b>Season</b> at the origin (${BA("seasons","Seasons")}).`,`<b>Destination:</b> freight into a market where trucks pile up pays more (${BA("reload","reload odds")}).`])+S(`A fuel surcharge passes on ${K(A.fuel.surchargePassThrough)} of diesel's move above ${A.fuel.baseFd.toFixed(2)} FD/gal (at ${A.fuel.surchargeMpg} mpg). The ceiling is the reference rate plus ${K(C.npcCeilingMarkup-1)}. Most loads clear somewhere between the two.`)},{id:"reload",section:vg,title:"Headhaul, backhaul and reload odds",html:S("Some markets consume far more than they ship. Miami takes in plenty and sends little out, so trucks pile up there and wait. Freight <i>into</i> Miami is the headhaul and pays well; freight <i>out</i> is the backhaul and barely pays. Producing markets work the other way.")+S("<b>Reload odds</b> combine a market's balance for each trailer type with how tight it has been lately against the national average, smoothed over about a week. Every load shows its destination's odds:")+tA(["Label","Odds","Means"],[["Good","\u2265 1.25","Easy to reload; freight in pays a bit less"],["Fair","0.8\u20131.25","About average"],["Poor","< 0.8","Expect empty miles; freight in pays more"]])+S(`Expected empty miles after delivery are ${g.reloadDeadheadMi} \xF7 the odds, between ${g.reloadDeadheadClamp[0]} and ${g.reloadDeadheadClamp[1]}. The destination's price factor is odds<sup>\u2212${C.reloadExponent}</sup>, within \xD7${C.reloadClamp[0]}\u2013${C.reloadClamp[1]}. A cheap load into a good market can beat a rich one into a dead end.`)},{id:"seasons",section:vg,title:"Seasons",html:S(`Every market has its own freight season, from the regional curves on beagl.ai's seasonality map: a slow build, a peak, a steep fall, then a dead zone. Each hub follows the nearest market's curve for dry van and reefer; flatbed follows the van curve at ${K(C.seasons.flatbedFromVan)} strength.`)+V(["South Florida produce builds slowly from winter, runs hot from late April through May, falls steeply in June and stays dead into autumn.","Georgia and the Carolinas pick up in June as Florida fades; the West and North run later in summer and fall.","Dry van and flatbed rise with produce season too, and northern markets tighten in winter.",`Late December volume drops to ${K(C.seasons.lateDecVolume)} for the holidays.`])+S(`A season moves freight volume (\xD7${C.seasons.volumeClamp[0]}\u2013${C.seasons.volumeClamp[1]}) and the posted rate (\xD7${C.seasons.rateClamp[0]}\u2013${C.seasons.rateClamp[1]}), and more freight tightens the market on top. The edge is timing: be where the season is going before the rates show it. The Company tab's <i>Seasons now</i> card shows the hottest and coldest markets; each load shows its origin's season.`)},{id:"cycle",section:vg,title:"Booms, busts and stabilizers",html:S("National freight demand follows a Cass-style cycle. The Company tab shows the demand dial: above 1.1 is a boom (more freight, higher rates), below 0.9 a slump. Booms invite everyone to buy trucks; the trucks arrive after the dealer's lead time, often as the market turns.")+S(`Published stabilizers keep the money supply in check. Each month NPC freight volume moves up to ${K(A.stabilizers.volumeStepPerMonth)} (within \xD7${A.stabilizers.volumeRange[0]}\u2013${A.stabilizers.volumeRange[1]}) and the diesel rack spread up to ${K(A.stabilizers.rackStepPerMonth)} (within \xB1${K(A.stabilizers.rackSpreadBand)}), toward FD sinks matching faucets. After the token launches the profit tax moves first (${BA("token","The token")}).`)},{id:"fuel",section:vg,title:"Fuel",html:S(`Diesel starts at ${A.fuel.baseFd.toFixed(2)} FD a gallon and follows real diesel prices at half strength, within \xB1${K(A.fuel.clamp[1]-1)}, times the rack spread. Your fuel bill is miles \xF7 mpg \xD7 price: a Workhorse gets ${A.tractors.workhorse.mpg} mpg, a Highway Pro ${A.tractors.highwayPro.mpg}, a Flagship ${A.tractors.flagship.mpg}. Wear costs up to ${K(A.wear.mpgLossWorn)} of that, million-mile trucks gain up to ${K(A.wear.maxFuelBonus)}, and your driver moves it \xB1${K(A.labor.driver.mpgRange/2)}. The fuel surcharge on every load passes most of a price spike to shippers.`)},{id:"brokers",section:vg,title:"Brokers and contracts",html:S(`About ${K(A.freight.npcBrokerOnlyShare)} of NPC freight is tendered to AI brokers at contract rates, which trail the spot market by about ${A.brokerRisk.contractLagDays} days. A broker reposts the load at its margin (typically 6\u201312%) and pays the carrier whatever the shipper does. In a spike, brokers pay carriers more than their contracts bring in; in a slide, the contracts pad their margin.`)+S(`Some shippers don't pay their brokers (about ${K(A.brokerRisk.defaultRate)} of loads, more in a slump). The broker still pays its carrier. Brokers choose which carriers they'll load: see ${BA("vetting","Vetting")}.`)}]}var DC="Money";function xQ(A){let g=A.insurance,C=A.token,B=A.miles;return[{id:"fd",section:DC,title:"Where FD comes from and goes",html:S("Freight Dollars (FD) are the game's money. Every FD movement is double-entry: it comes from somewhere and goes somewhere.")+V(["<b>In:</b> NPC shippers paying for freight, the NPC market buying facility goods, starting grants, and (after launch) FD bought with dollars.","<b>Out (burned):</b> fuel, wages, maintenance and repairs, insurance, yard rent, overhead, dispatcher pay, lease shares, the dealer, fines and judgments, board fees, the holding cost, the profit tax after launch.","<b>Between companies:</b> brokers and shippers paying carriers, used-truck sales, loans and deposits."])+S(`The Company tab's market report shows the freight cycle and rates; stabilizers keep what's burned close to what's created (${BA("cycle","Booms, busts and stabilizers")}).`)},{id:"insurance",section:DC,title:"Insurance",html:S("Every company holds a one-game-year policy, priced when it's signed and fixed for the term, billed weekly for each truck on the road. It renews at the then-current price.")+S(`<b>Price per truck per year</b> = ${U(g.baseAnnualPerTruck)} FD \xD7 your record \xD7 your home hub's garaging factor \xD7 the insurance market.`)+tA(["Your record","Factor"],[["New authority (not yet rated)",`\xD7${g.rating.none}`],["Satisfactory",`\xD7${g.rating.satisfactory}`],["Conditional",`\xD7${g.rating.conditional}`],["Unsatisfactory",`\xD7${g.rating.unsatisfactory}`],["Each safety alert",`+${K(g.perAlert)}`],["At-fault crashes",`+${K(A.safety.crash.surcharge.pdo)} (property), +${K(A.safety.crash.surcharge.injury)} (injury), +${K(A.safety.crash.surcharge.fatal)} (fatal), wearing off ${K(A.safety.crash.surchargeDecayPerMonth)} a month`],[`Satisfactory, no crashes or alerts, ${g.cleanYears}+ years`,`\xD7${g.cleanDiscount}`]])+V([`The record factor stays within \xD7${g.clamp[0]}\u2013${g.clamp[1]}.`,`<b>Garaging:</b> where you're based. Florida, Louisiana, New Jersey, Texas, Georgia and California cost more; the upper Midwest and Mountain West less (${BA("home","Choosing a home hub")}).`,`<b>The market:</b> when insurers pay out more than ${K(g.market.targetLossRatio)} of what they take in over a year, the market hardens ${K(g.market.stepPerMonth)} a month, and softens when they pay out less, within \xD7${g.market.range[0]}\u2013${g.market.range[1]}. Everyone's crashes move everyone's rates.`,"<b>Mid-term:</b> after an at-fault crash with injuries or deaths, or a review that changes your rating (including a new authority's first clean audit), your insurer re-writes the policy at the new price for a new year.",`Dispatchers spread the premium over a typical truck's ${U(g.loadedMilesPerYear)} loaded miles a year when they price loads.`])},{id:"holding",section:DC,title:"The holding cost",html:S(`Cash isn't free to sit on. Each week ${K(A.holdingCost.weeklyRate)} of any cash above your working capital is burned. Working capital is the larger of ${U(A.holdingCost.minProtectedFd)} FD and what you spent in the last four weeks, so a buffer for a bust is free and a hoard isn't. Put spare FD to work: trucks, facilities, or Equipment Finance loans to others.`)},{id:"broke",section:DC,title:"Going broke",html:V([`More than ${U(A.insolvency.debtLimitFd)} FD in the red at ${A.insolvency.weeksInDebt} weekly checks in a row and the company is liquidated: bidding stops, staff are let go, owned trucks are fire-sold (from ${K(A.insolvency.fireSaleStartPctOfValue)} of value, down ${K(A.insolvency.fireSaleStepPctOfValue)} a week), facilities close, and extra leases go back.`,"A judgment bigger than the company can pay winds it up the same way.","Then you start over on the NPC lease with whatever is left, no grant. Debts are written off, your reputation starts fresh, and any airdrop not yet unlocked is forfeited."])},{id:"miles",section:DC,title:"Miles",html:S("Miles are points for hauling well, and they become the airdrop at launch. Each delivered load earns its loaded miles \xD7:")+V([`<b>On time:</b> early (${A.freight.earlyThresholdMinutes/60}+ hours) \xD7${B.onTime.early}, on time \xD7${B.onTime.onTime}, late \xD7${B.onTime.late};`,`<b>Margin:</b> your margin \xF7 ${K(B.marginTarget)}, within \xD7${B.marginClamp[0]}\u2013${B.marginClamp[1]};`,`<b>Reputation level:</b> \xD7${B.reputationRange[0]}\u2013${B.reputationRange[1]};`,`<b>Truck ladder:</b> your first truck \xD7${A.company.truckLadder[0]}, then ${A.company.truckLadder.slice(1).join(", ")}, then \xD7${A.company.truckLadderFloor} for every truck after.`])+S(`No Miles for a load that cleared more than ${K(B.rateOutlierPct)} off its reference rate (a hot load's premium counts as its reference). At most ${U(B.dailyCapPerCompany)} Miles a day per company, and only the first ${B.maxLoadsPerLanePairPerDay} loads a day on the same lane count. Brokers earn ${B.brokerPerMile} per mile brokered.`)},{id:"token",section:DC,title:"The token",html:DA("Beta")+S(`The first ${C.betaYears} game years are the beta: FD is play money and Miles pile up.`)+DA("Launch")+V(["FD above each company's working capital is burned; what's kept is locked: it can be spent in the game, not sold.",`An FD/USDC pool opens at $${C.launch.priceUsd} per FD with ${U(C.launch.seedUsd)} dollars of protocol-owned liquidity.`,`<b>Airdrop:</b> ${U(C.airdrop.fd)} FD shared by Miles, at most ${K(C.airdrop.capShare)} to any one company. ${K(C.airdrop.atLaunch)} unlocks at launch; the rest over ${C.airdrop.unlockWeeks} weeks, a slice each week you handle at least ${C.airdrop.loadsPerWeek} loads (a missed week's slice is forfeited). Or claim the rest at once for ${K(1-C.airdrop.instantClaimHaircut)} of it.`])+DA("After launch")+V([`Buy FD with dollars (${K(C.exchange.buyFeePct)} fee) or sell unlocked FD (${K(C.exchange.sellFeePct)} fee, burned) on the Money tab.`,`<b>Profit tax:</b> ${K(C.profitTaxRate)} of each week's operating profit above ${U(C.profitTaxAllowanceFd)} FD is burned. The rate moves ${K(C.taxStabilizer.stepPerMonth)} a month within ${K(C.taxStabilizer.range[0])}\u2013${K(C.taxStabilizer.range[1])} to keep the money supply steady.`,"Half of the game's revenue buys FD back from the pool and burns it."])}]}var pC="Running trucks";function WQ(A){let g=A.labor,C=A.hos,B=A.safety.hotLoads,e=A.wear,o=A.breakdowns;return[{id:"dispatch",section:pC,title:"You against your dispatcher",html:S("Standing orders are your dispatcher's rules. Whoever dispatches (you as owner, plus any dispatchers you hire) runs them every round for every idle truck you didn't bid on by hand. Their skill decides how well:")+V([`<b>Pricing:</b> they misjudge their own costs by about ${K(g.dispatcher.noise[0])} when green and ${K(g.dispatcher.noise[1])} at their best. The loads they win are disproportionately the ones they underpriced.`,`<b>Reload awareness:</b> they price in ${g.dispatcher.reloadAware[0]}\xD7 to ${g.dispatcher.reloadAware[1]}\xD7 of the empty run out of a destination.`,`<b>Foresight:</b> they look 0 to ${g.dispatcher.foresightDays[1]} days ahead on each market's season when pricing loads and moving idle trucks.`,`<b>Span:</b> you can run ${g.owner.span} trucks; a hired dispatcher ${g.dispatcher.span[0]}\u2013${g.dispatcher.span[1]}. Past the team's span, some idle trucks sit out each round.`])+S("<b>You can always beat the best of them by hand.</b> You see everything they see: exact ceilings, reload odds, every market's season a year out, and where the AI is crowding. You aren't held to their rule set or their mistakes. The Staff tab shows your team's numbers.")},{id:"orders",section:pC,title:"Standing orders",html:S("Set them at the bottom of the Fleet tab. They're the same rules the AI companies use.")+tA(["Rule","What it does"],[["Bid at break-even plus %","Asks your break-even on the load plus a margin, capped at the ceiling"],["Bid at % of the ceiling","Asks a share of the posted ceiling, whatever it costs you"],["Never below break-even +","A floor: skips any load that wouldn't clear it"],["Max empty miles","How far a truck will run empty to a pickup (up to 150)"],["Move idle trucks","After a number of idle rounds, sends the truck empty to the hub nearby with the most uncovered freight for its trailer"],["Book loads between rounds","Takes a load at its book-now price when it clears break-even plus your margin; the margin shrinks the longer the truck sits and the farther its driver is from home"],["Bring drivers home","After so many days out, the truck heads for your home hub and its driver takes days off; the dispatcher leaves it alone until they're over"]])+S(`Each truck bids on up to ${A.board.maxBidsPerTruckPerRound} loads a round, most profitable first; it wins at most one. You get ${A.board.freeStandingOrders} standing orders plus a floor.`)},{id:"hours",section:pC,title:"Hours, dock time and delivery windows",html:V([`A driver gets ${C.drivingHoursPerDay} driving hours in a 24-hour duty day that opens when the truck first rolls: about ${C.drivingHoursPerDay*C.avgMph} miles at ${C.avgMph} mph (your driver's skill moves speed \xB1${K(g.driver.mphRange/2)}). A team of two drivers gets ${A.safety.hos.teamHours}.`,`Loading and unloading take ${A.dwell.loadMinutes[0]/60}\u2013${A.dwell.loadMinutes[1]/60} hours each, on duty but not driving.`,`A load is due after the drive at the legal pace, the worst-case dock time and ${A.freight.deliverySlackMinutes/60} hours of slack. ${A.freight.earlyThresholdMinutes/60} hours early or more counts as early; past due is late.`,`A breakdown stops the truck ${o.delayHours[0]}\u2013${o.delayHours[1]} hours and can make it late.`])+DA("Hot loads")+S(`About ${K(B.share)} of long-haul freight (${B.minMiles} miles or more) is hot: it pays ${B.premium[0]}\u2013${B.premium[1]}\xD7 for a window that assumes ${B.hoursPerDay} driving hours a day with only ${B.slackMinutes/60} hours of slack. A solo driver can't make it legally; a team can. Delivered late, a hot load pays only ${K(B.lateKeepsPremium)} of its premium. Hot loads are at least standard-vetted.`)},{id:"roads",section:pC,title:"Roads, tolls and weather",html:S(`Every lane runs on the real road network: the interstates and the US highways, drawn on the map, with each route the fastest way between its two hubs at interstate speed (${A.roads.routing.mph[0]} mph) or two-lane highway speed (${A.roads.routing.mph[1]} mph). Trucks move along the road on the map, and weigh stations sit on the roads a route actually takes.`)+V(["<b>Tolls.</b> Toll roads (the Pennsylvania Turnpike, the Ohio and Indiana toll roads, the New Jersey Turnpike, Florida's Turnpike, the Kansas and Oklahoma turnpikes, the New York Thruway and others) charge a truck by the mile at their real rates. Routing weighs a toll against the time it saves, so a free road wins when it's nearly as quick. Tolls are paid as the miles are driven, the load board shows them on every load, and your break-even counts them. Shippers pay toll routes a little more, the way they pay a fuel surcharge.",`<b>Two-lane highway.</b> A stretch of US highway is slower and ${A.roads.crashHighwayMult}\xD7 as likely to see a crash as an interstate. The load board flags loads whose route runs on it.`,`<b>Winter.</b> From December to February, crash odds climb with latitude north of ${A.roads.winter.fromLat}\xB0: up to +${K(A.roads.winter.gain.interstate)} on interstates and +${K(A.roads.winter.gain.highway)} on highways at the Canadian border. A Minneapolis run in January is not a Houston run in June.`,"<b>Hours.</b> A load's delivery window comes from its route's own driving time, not a flat speed, so a two-lane lane allows more time than an interstate lane of the same length."])},{id:"reputation",section:pC,title:"Reputation and on-time",html:S(`Your reputation is your smoothed on-time rate: a new company counts as ${A.reputation.priorLoads} loads at ${K(A.reputation.start)}, then every delivery moves it. It's ${K(A.board.scoreWeights.reputation)} of every bid's score, so a good record wins loads at higher rates.`)+S(`Your level is the square root of loads delivered \xF7 ${A.reputation.loadsPerLevelSq}, up to ${A.reputation.maxLevel}, and it multiplies the Miles you earn (\xD7${A.miles.reputationRange[0]}\u2013${A.miles.reputationRange[1]}). Going broke resets both.`)},{id:"wear",section:pC,title:"Wear, breakdowns and rebuilds",html:V([`An owned truck's condition falls from 100% to 0 over ${U(e.lifeMiles)} miles since its last rebuild. Fully worn, it burns ${K(1/(1-e.mpgLossWorn)-1)} more fuel and doubles maintenance.`,`Breakdowns: a new Workhorse about once every ${U(1e3/o.per1000MiNew)} miles, \xD7(1 + ${o.wornMultiplier}\xB7wear\xB2) as it wears and more as it ages; a Highway Pro breaks down ${K(1-A.tractors.highwayPro.breakdownMult)} less, a Flagship ${K(1-A.tractors.flagship.breakdownMult)} less. Each costs ${U(o.repairFd[0])}\u2013${U(o.repairFd[1])} FD on an owned truck; the lessor pays on a leased one. A skilled driver means fewer.`,`<b>Rebuild</b> an idle owned truck at ${K(e.rebuildMaxCondition)} condition or worse: ${e.rebuildDays} days in the shop, back to 100%. It costs ${U(e.rebuildFd.workhorse)} FD for a Workhorse (${U(e.rebuildFd.highwayPro)} Highway Pro, ${U(e.rebuildFd.flagship)} Flagship), more the higher the odometer: double at ${U(e.rebuildAgeMi)} miles.`,"A worn truck's break-even is higher, so it loses bids to fresher trucks. That, not a rule, is the reason to rebuild.",`<b>Million-mile trucks:</b> a level every ${U(e.milesPerLevel)} miles, up to ${e.maxLevel}; every five levels adds ${K(e.fuelBonusPerFiveLevels)} fuel economy, up to ${K(e.maxFuelBonus)}.`,`Defects (worn brakes, tires, lights) build up slowly on any truck, faster if maintenance is skipped. They raise breakdown and crash odds and get trucks put out of service at inspections. Fix them from the Fleet tab for ${U(A.safety.maintenance.fixFdPerDefect)} FD each.`])}]}var ao="Reference";function NQ(A){let[g,C]=A.time.boardRoundHours;return[{id:"numbers",section:ao,title:"Numbers at a glance",html:tA(["",""],[["A game day (live)",`${A.time.realHoursPerGameDayLive} real hours`],["Board rounds",`${String(g).padStart(2,"0")}:00 and ${C}:00`],["Starting cash",`${U(A.company.startingGrantFd)} FD`],["NPC lease",`${K(A.costs.npcLeaseShareOfGross)} of each load's pay`],["Workhorse + dry van, list",`${U(A.dealerFd.tractor.workhorse+A.dealerFd.trailer.van)} FD`],["Dealer lead time",`${A.dealerDelivery.baseDays}+ days`],["Driving per duty day",`${A.hos.drivingHoursPerDay} h solo, ${A.safety.hos.teamHours} h team`],["Average speed",`${A.hos.avgMph} mph`],["Diesel base",`${A.fuel.baseFd.toFixed(2)} FD/gal`],["Driver market pay",`${A.labor.driver.payPerMile[0].toFixed(2)}\u2013${A.labor.driver.payPerMile[1].toFixed(2)} FD/mi`],["Dispatcher pay (full span)",`${U(A.labor.dispatcher.payPerWeek[0])}\u2013${U(A.labor.dispatcher.payPerWeek[1])} FD/wk`],["Insurance base",`${U(A.insurance.baseAnnualPerTruck)} FD per truck per year`],["Yard rent base",`${A.homeBase.yardPerTruckWeek} FD per truck per week`],["Trucks you dispatch yourself",A.labor.owner.span],["Truck cap per company",A.company.maxTrucks],["Insolvency",`${U(A.insolvency.debtLimitFd)} FD in the red, ${A.insolvency.weeksInDebt} weeks running`],["Token launch",`end of year ${A.token.betaYears}`]])},{id:"glossary",section:ao,title:"Glossary",html:tA(["Term","Meaning"],[["Backhaul","The return trip out of a market that takes in more than it ships: cheap freight"],["Break-even","The rate per mile that just covers a load's costs, including the empty miles before and after"],["Ceiling","The most a poster will pay per mile for a load"],["Deadhead","Miles driven empty"],["Duty day","The 24 hours from when a truck first rolls; driving hours reset after it"],["FD","Freight Dollars, the game's money"],["FSC","Fuel surcharge, paid on top of the linehaul rate"],["Garaging","Where a carrier is based, for insurance"],["Headhaul","Freight into a market that takes in more than it ships: well paid"],["Hot load","Freight with a tight window, at a premium"],["Load-to-truck ratio","Loads posted against trucks available nearby; higher means tighter, better-paying"],["Miles","Points earned for hauling well, converted to the airdrop at launch"],["Out of service","Ordered off the road at an inspection until a problem is fixed"],["Reload odds","How easily a truck finds its next load after delivering at a hub"],["Span","How many trucks a dispatcher can run"],["Standing orders","Your dispatcher's rules for bidding and moving trucks"],["Vetting","A poster's requirements for who may haul its freight"]])},{id:"faq",section:ao,title:"Questions",html:S(`<b>Why did I lose a bid at a lower rate than the winner?</b> Price is ${K(A.board.scoreWeights.price)} of the score; reputation, empty miles and the home-market edge make up the rest.`)+S("<b>Why are my trucks sitting idle?</b> No freight in range that clears your floor, no driver, or your fleet is past your dispatch team's span (the Staff tab says which).")+S("<b>Why did my insurance go up?</b> A renewal re-prices it: check the Company tab for your record, garaging and the market. A serious crash or a bad rating re-writes it at once.")+S(`<b>Can I pause the live world?</b> No. Only test worlds pause. See ${BA("worlds","The live world and test worlds")}.`)+S(`<b>Is a hired dispatcher better than me?</b> Never better than your own bids by hand. See ${BA("dispatch","You against your dispatcher")}.`)}]}var mC="Safety and the law";function jQ(A){let g=A.safety,C=g.score.thresholds,B=g.review,e=g.crash,o=A.fraud.vetting;return[{id:"record",section:mC,title:"Your safety record",html:S("Like a real carrier, your company is scored in four areas. Violations count three times as much for six months, twice as much for the next six, once more for the year after, then drop off. Inspections with nothing found dilute the score.")+tA(["Area","Alert at"],[["Hours of service",C.hos],["Unsafe driving",C.unsafe],["Vehicle maintenance",C.maintenance],["Crashes (per truck)",C.crash]])+S("An alert gets your trucks pulled into more weigh stations, raises insurance at renewal, keeps strict brokers away, and two at once call in an auditor.")},{id:"inspections",section:mC,title:"Weigh stations and inspections",html:V([`Trucks pass weigh stations on the main interstate corridors, at about the real locations. A station is open ${K(g.enforcement.stationOpen)} of the time. Clean carriers are waved through most of the time; alerts, a poor rating or a brand-new authority get pulled in far more.`,"Police make traffic stops on the road, more often for trucks that are speeding.","An inspection checks the driver and logs, the truck, or both. Problems found mean fines, violations on your record, and sometimes an <b>out-of-service order</b> on the spot: the driver must rest, or the truck is repaired at roadside prices before it moves.","Defects build up on every truck, slowly with full maintenance. Fix them from the Fleet tab before an inspector finds them."])+S("Every inspection, clean or not, shows up in your ticker.")},{id:"reviews",section:mC,title:"Compliance reviews and ratings",html:V([`A new authority gets a <b>new-entrant audit</b> at ${B.newEntrantDay} days. After that, reviews follow two alerts at once (at most every ${B.alertCooldownDays} days), an at-fault crash with injuries or deaths, or a scheduled follow-up.`,`An auditor goes through your records, fines what turns up (capped at ${U(B.finesCap)} FD a review), and rates you <b>satisfactory</b>, <b>conditional</b> or <b>unsatisfactory</b>.`,`<b>Conditional:</b> insurance \xD7${A.insurance.rating.conditional} at once, strict brokers won't load you, more inspections, and a follow-up in ${B.rereviewDays.conditional} days that can clear it.`,`<b>Unsatisfactory:</b> insurance \xD7${A.insurance.rating.unsatisfactory} at once, most brokers won't load you, and ${B.rereviewDays.unsatisfactory} days to clean up. Still unsatisfactory at the follow-up and your authority is revoked (${BA("shutdowns","Shutdowns")}).`,"Bad ratings also cost you people: drivers don't like working for a carrier with a poor rating."])},{id:"crashes",section:mC,title:"Crashes",html:S(`A typical legal truck crashes about once every ${U(1e6/e.per1MMi)} miles. Fatigue, speed, defects, wear and a green driver all raise the odds; a veteran driver lowers them. About ${K(e.fatalShare)} of crashes kill someone and ${K(e.injuryShare)} injure someone; fatigue or speed makes them deadlier.`)+S("What a crash costs depends on why it happened:")+tA(["Cause","What follows"],[["Not at fault","The other side's insurer pays. You lose the load and days in the shop."],["At fault, nothing wrong",`Your insurer pays up to ${U(e.insuranceLimitFd)} FD. You pay the ${U(e.deductibleFd)} FD deductible and anything over the limit; premiums jump at renewal (or at once, for injuries and deaths); a crash on your record.`],["At fault, with violations behind it",`The same, but juries multiply verdicts ${e.negligenceMult[0]}\u2013${e.negligenceMult[1]}\xD7. A verdict the company can't pay winds it up.`],["Fatal, caused by falsified hours or known defects",`A crime. Authority revoked, everything the company has seized, the owner barred for ${g.bars.criminal} days, and the people who ran the truck that way jailed.`]])+S(`A fatal crash usually totals the truck; a leased one costs ${U(e.leasedTotalLossFd)} FD owed to the lessor. A crash with cargo aboard loses the load and its pay, and you pay the cargo deductible.`)},{id:"shutdowns",section:mC,title:"Shutdowns",html:S("A revoked authority means the fleet is sold off, the staff are let go, Miles and any locked airdrop are forfeited, and the account can't file for new authority until its bar runs out:")+tA(["Cause","Bar"],[["Unsatisfactory at the follow-up review",`${g.bars.unsatisfactory} days`],["A second revocation",`${g.bars.imminentHazard} days`],["A crime",`${g.bars.criminal} days, everything seized`],[`${g.permanentAfterCrimes} crimes`,"Barred for good"]])+S("When the bar is over, the account gets new authority and starts over on a lease. Brokers can see the old revocation for a year.")},{id:"vetting",section:mC,title:"Vetting",html:S("Brokers and shippers choose who may haul their freight. Every load shows its poster's requirement:")+tA(["Tier","Requires"],[["Open","Anyone"],["Standard",`Authority at least ${o.standard.minAuthorityDays} days old, no open claims, not rated unsatisfactory`],["Strict",`All of the above, plus at least ${o.strict.minAuthorityDays} days and ${o.strict.minDelivered} loads delivered (or a year old), no conditional rating or alerts, no revocation in the past year; tracking on the load`]])+S("Hot loads are at least standard. A new carrier starts on open freight and earns its way up. Open freight draws more bidders, so it tends to clear cheaper.")}]}var VC="Staff";function RQ(A){let g=A.labor,C=g.morale,B=[0,.25,.5,.75,1].map((e,o)=>["\u2605".repeat(o+1),`${(g.driver.payPerMile[0]+(g.driver.payPerMile[1]-g.driver.payPerMile[0])*e).toFixed(2)} FD/mi`,`${K(g.driver.mpgRange*(e-.5))}`,`${K(-g.driver.maintRange*(e-.5))}`,`\xD7${(g.driver.crash[0]+(g.driver.crash[1]-g.driver.crash[0])*e).toFixed(1)}`]);return[{id:"drivers",section:VC,title:"Drivers",html:S(`Every truck needs a driver; a truck without one sits. You drive your first truck yourself, at a fixed owner's draw of ${g.owner.driverPayPerMile.toFixed(2)} FD/mi, and you never quit on yourself. Every other seat is a hire.`)+tA(["Skill","Market pay","Fuel economy","Maintenance and breakdowns","Crash odds"],B)+S(`Speed moves \xB1${K(g.driver.mphRange/2)} with skill too. Market pay is multiplied by the wage index, which rises up to \xD7${g.wageIndex.range[1]} when the pool of unemployed drivers runs thin and falls to \xD7${g.wageIndex.range[0]} when it's deep.`)+S(`<b>Experience:</b> each mile closes a little of the gap between a driver's skill and their own potential (gap \xD7 miles \xF7 ${U(g.driver.learnMiles)}). A rookie with promise becomes a veteran in a year or two of steady driving, and from then on the market will pay them like one.`)+S(`<b>Teams:</b> seat a co-driver on a truck that already has a driver and it runs ${A.safety.hos.teamHours} hours a day legally. Each driver earns ${K(g.driver.teamPayShare)} of their rate on every mile, so a team costs about ${K(g.driver.teamPayShare*2-1)} more per mile than one driver and covers twice the ground. Teams are how hot loads get delivered legally.`)+S("Every driver carries a record of violations and crashes that any employer can see before hiring.")},{id:"hometime",section:VC,title:"Fatigue, home time and per diem",html:S("Drivers wear down on the road. Each one has a fatigue level you can see on the Staff tab and on their truck.")+V([`<b>Weeks out:</b> past ${A.fatigue.roadDays} consecutive days away from the home hub, fatigue builds every day, faster the longer they're out.`,`<b>Long days:</b> a day over ${A.fatigue.longDayHours} driving hours builds it too, and each consecutive long day builds more than the last. Running over hours on falsified logs makes long days routine.`,`<b>Days off:</b> ${A.fatigue.resetDays} straight days off at home reset fatigue to zero. Each extra day off banks a buffer (up to ${A.fatigue.bufferMax} days' worth) that absorbs the next stretch before fatigue starts climbing. A day off on the road takes a little off but doesn't reset the clock.`,`<b>What it does:</b> crash odds \xD7${1+A.fatigue.crashMult} at full fatigue, the truck runs up to ${K(A.fatigue.paceLoss)} slower, and a tired hire's morale drops every day until they quit.`])+DA("Home time")+S(`The standing order "Bring drivers home" brings a truck home after a set number of days out and rests its driver for a set number of days; the dispatcher leaves the truck alone meanwhile. A truck due home keeps hauling, but only loads that deliver near home or at least ${A.fatigue.homeward.closerByMi} miles closer to it; it runs empty the last ${A.fatigue.homeward.deadheadWithinMi} miles, or after ${A.fatigue.homeward.deadheadAfterRounds/2} days without a homeward load. "Send home" on a truck's card runs it straight home. Teams rest together. You drive your first truck yourself, and the same rules apply to you.`)+DA("Per diem")+S(`Every day a truck sits idle away from the home hub costs the company ${A.labor.driver.perDiemFd} FD in per diem (a layover: the hotel, the parking, the meals). On the road, wages cover it. A truck waiting around far from home is spending money and wearing its driver out; that's why a local carrier can wait for a good load and a visitor can't.`)},{id:"dispatchers",section:VC,title:"Dispatchers",html:S(`You dispatch your first ${g.owner.span} trucks yourself. Past that you need dispatchers, or some of your idle trucks sit out each round. A dispatcher's skill sets how many trucks they can run and how well (${BA("dispatch","You against your dispatcher")}):`)+tA(["Skill","Runs","Pricing error","Reload priced in","Season foresight","Full-span pay"],[0,.5,1].map(e=>[e===0?"\u2605":e===.5?"\u2605\u2605\u2605":"\u2605\u2605\u2605\u2605\u2605",`${Math.round(g.dispatcher.span[0]+(g.dispatcher.span[1]-g.dispatcher.span[0])*e)} trucks`,`~${K(g.dispatcher.noise[0]+(g.dispatcher.noise[1]-g.dispatcher.noise[0])*e)}`,`${(g.dispatcher.reloadAware[0]+(g.dispatcher.reloadAware[1]-g.dispatcher.reloadAware[0])*e).toFixed(2)}\xD7`,`${Math.round(g.dispatcher.foresightDays[1]*e)} days`,`${U(g.dispatcher.payPerWeek[0]+(g.dispatcher.payPerWeek[1]-g.dispatcher.payPerWeek[0])*e)} FD/wk`]))+S(`Pay is quoted for a full span and billed weekly for the trucks a dispatcher actually runs past your own ${g.owner.span}, with a quarter as a retainer. Your best dispatcher takes the trucks first. Dispatchers learn with every load they book (gap \xD7 loads \xF7 ${U(g.dispatcher.learnLoads)}). So do you: your own dispatching skill grows the same way.`)},{id:"people",section:VC,title:"Hiring, poaching and keeping people",html:V([`<b>Hiring:</b> anyone in the pool takes a job at their asking pay or more: market pay for their skill, times a personal premium of ${K(g.pool.personal[0]-1)} to ${K(g.pool.personal[1]-1)}. The pool refills every week with rookies and returning veterans.`,`<b>Morale</b> drifts each week toward a target set mostly by pay against market (every 10% under costs about ${K(C.payWeight*.1)}), plus up to ${K(C.tenureCap)} for tenure, minus ${K(C.wornTruckPenalty)} for a worn-out truck, ${K(C.badRatingPenalty)} for a conditional or unsatisfactory safety rating, and up to ${K(C.pushedPenalty)} for running outside the rules, which the best drivers mind most.`,`<b>Quitting:</b> settled people rarely leave; unhappy ones quit at up to about ${K(C.quitBase+C.quitSlope*.5)} a week. A driver left without a truck walks after ${C.unseatedWeeks} weeks. Anyone mid-trip finishes the load first.`,`<b>Poaching:</b> anyone working elsewhere will move for a raise of ${K(C.loyalty[0])} (miserable) to ${K(C.loyalty[1])} (happy) over what they make, and at least their asking pay. Their employer gets ${C.noticeDays} days to match. If they match, they stay.`,"<b>Your people get offers too.</b> The Staff tab flags them with a Match button. Raises keep people; a cut lowers morale on the spot.","Going broke or losing your authority lets everyone go."])},{id:"autostaff",section:VC,title:"Auto-staff",html:S("On by default. Each day it seats any idle driver on a truck that needs one, hires the best-value driver in the pool for any remaining empty seat (asking pay against what their skill saves), hires a dispatcher when your fleet outgrows your team's span, and lets go a dispatcher you no longer need. It doesn't give raises, match offers, or poach: those are yours. Turn it off on the Staff tab to do it all by hand.")}]}var io="Getting started";function XQ(A){let[g,C]=A.time.boardRoundHours,B=A.time.realHoursPerGameDayLive;return[{id:"start",section:io,title:"Your first week",html:S("LANES is one shared freight market. You run a carrier: you bid on loads, haul them, and grow from one leased truck into a fleet. Every other company is a player or an AI competing for the same freight.")+S(`You start as an owner-operator: one NPC-leased Workhorse with a dry van, ${U(A.company.startingGrantFd)} FD, and you behind the wheel. The lessor takes ${K(A.costs.npcLeaseShareOfGross)} of every load's pay and maintains the truck.`)+V([`<b>Day 1:</b> open the Load board, pick a load near your truck, and bid. Bids clear at ${String(g).padStart(2,"0")}:00 and ${C}:00 game time.`,"<b>Every day:</b> your dispatcher (you, at first) bids for idle trucks you don't bid on by hand. Set its rules at the bottom of the Fleet tab.",`<b>First goal:</b> save ${U(A.dealerFd.tractor.workhorse+A.dealerFd.trailer.van)} FD for your own Workhorse and dry van. Owning ends the lessor's cut. See ${BA("buying","Buying trucks")}.`,`<b>Then:</b> more trucks, drivers to run them (${BA("drivers","Drivers")}), a dispatcher once you pass ${A.labor.owner.span} trucks (${BA("dispatchers","Dispatchers")}).`])+S(`New authority is on probation: some brokers won't load you until your authority is ${A.fraud.vetting.standard.minAuthorityDays} days old, the strictest not before ${A.fraud.vetting.strict.minAuthorityDays} days and a record. See ${BA("vetting","Vetting")}.`)},{id:"worlds",section:io,title:"The live world and test worlds",html:S(`<b>The live world</b> is shared by every player and runs on the real clock: a game day every ${B} real hours, a game year about every ${Math.round(A.time.daysPerSeason*B/24)} real days. It never pauses, nothing resets, and every order stands. Your orders reach everyone and take effect about half a real minute later, at the same moment on every screen.`)+S("<b>A test world</b> is a private copy of the rules with only you and the AI in it. You can pause it and run it up to a game day every two seconds. On the public test site your test world is kept in your browser; starting a new one replaces it, and a test world from older rules can't be replayed.")+S(`<b>Starts:</b> the live world only offers the owner-operator start. A test world also offers a small fleet: two used trucks and ${U(A.company.startingGrantFd+2e4)} FD.`)},{id:"screen",section:io,title:"The screen and controls",html:V(["<b>The map</b> shows every hub, the lanes between them, and the trucks on them: yours, other players', and the AI's. Tap a hub to see its open loads; tap your truck to select it.","<b>The ticker</b> under the clock lists what just happened to your company: loads won and delivered, breakdowns, inspections, staff news.","<b>The tabs:</b> Fleet (your trucks and the dispatcher), Load board, Staff, Dealer (new, used and leased trucks, facilities), Money (cash, loans, the exchange), Company (your record, the market report, the leaderboard), and this Guide."])+tA(["Control","What it does"],[["Drag / pinch / wheel","Pan and zoom the map"],["+ / \u2212 / 0","Zoom in, out, fit the map"],["F","Full screen"],["Space, 1\u20133","Pause and set the speed (test worlds only)"]])}]}function zQ(A){return[...XQ(A),...HQ(A),...WQ(A),...RQ(A),...qQ(A),...xQ(A),...jQ(A),...NQ(A)]}var $C={version:"0.13.0-phase0.18",time:{gameMinutesPerDay:1440,realHoursPerGameDayLive:6,daysPerSeason:365,daysPerMonth:30,boardRoundHours:[6,18],simRealMsPerGameDay:6e4},hos:{drivingHoursPerDay:11,avgMph:50,dutyDayHours:24},dwell:{loadMinutes:[60,120],unloadMinutes:[60,120]},roads:{routing:{mph:[58,42],highwayStopHours:.05,timeValueFdPerHour:120},crashHighwayMult:1.6,winter:{months:[11,0,1],fromLat:36,toLat:49,gain:{interstate:.35,highway:.9}},tollsInRates:!0},map
