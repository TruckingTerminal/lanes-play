<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>LANES</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: a dispatcher's console — the map is the window, the side rack holds the paperwork, the ticker runs underneath. */
:root {
  --ink0: #0a0d18; --ink1: #121829; --ink2: #1c2540; --ink3: #2b3a5a; --steel: #475a7c; --fog: #7d8fae; --mist: #b6c4d9;
  --paper: #ece5d3; --amber: #f2a541; --amberD: #c4692a; --gold: #ffd36b; --red: #d6493a; --lime: #a6d65e; --cyan: #7fdcea;
  --display: "Press Start 2P", ui-monospace, Menlo, monospace;
  --body: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --data: "VT323", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ink1); color: var(--paper); font-family: var(--body); font-size: 16px; line-height: 1.35; }
#app { min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
img.px { image-rendering: pixelated; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.num { font-family: var(--data); font-size: 1.25em; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.label { font-family: var(--display); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fog); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-size: 12px; color: var(--amber); letter-spacing: 0.06em; }
h3 { font-size: 10px; color: var(--paper); letter-spacing: 0.04em; }
p { margin: 0; }
.muted { color: var(--fog); }
.good { color: var(--lime); }
.bad { color: var(--red); }
.warn { color: var(--amber); }

/* Chunky beveled panels and buttons. */
.panel { background: var(--ink2); border: 2px solid var(--ink0); box-shadow: inset 2px 2px 0 var(--ink3), inset -2px -2px 0 var(--ink1); padding: 12px; }
.btn { background: var(--ink3); border: 2px solid var(--ink0); box-shadow: inset 2px 2px 0 var(--steel), inset -2px -2px 0 var(--ink2); padding: 6px 10px; cursor: pointer; font-family: var(--display); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--paper); white-space: nowrap; }
.btn:hover { background: var(--steel); }
.btn:active { box-shadow: inset -2px -2px 0 var(--steel), inset 2px 2px 0 var(--ink2); transform: translateY(1px); }
.btn.primary { background: var(--amberD); box-shadow: inset 2px 2px 0 var(--amber), inset -2px -2px 0 #8a4519; color: var(--ink0); }
.btn.primary:hover { background: var(--amber); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.on { background: var(--amber); color: var(--ink0); box-shadow: inset 2px 2px 0 var(--gold), inset -2px -2px 0 var(--amberD); }
input[type=text], input[type=number], select { background: var(--ink0); border: 2px solid var(--ink3); padding: 5px 7px; min-width: 0; }
input[type=number] { width: 6.5em; font-family: var(--data); font-size: 1.2em; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.bar { height: 6px; background: var(--ink0); border: 1px solid var(--ink3); width: 80px; }
.bar > i { display: block; height: 100%; }

/* Title screen. */
#title { display: grid; gap: 16px; justify-items: center; padding-top: 8px; }
#titleCanvas { width: min(100%, 768px); height: auto; aspect-ratio: 16 / 9; border: 2px solid var(--ink0); box-shadow: 0 0 0 2px var(--ink3); }
.logo { font-family: var(--display); font-size: clamp(28px, 7vw, 56px); color: var(--gold); letter-spacing: 0.12em; text-shadow: 4px 4px 0 var(--amberD), 8px 8px 0 var(--ink0); }
.tagline { font-family: var(--display); font-size: 10px; color: var(--mist); letter-spacing: 0.1em; text-align: center; }
.menu { width: min(100%, 560px); display: grid; gap: 12px; }
.choice { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 10px; border: 2px solid var(--ink3); cursor: pointer; background: var(--ink1); }
.choice:has(input:checked) { border-color: var(--amber); background: var(--ink2); }
.choice input { accent-color: var(--amber); }
.field { display: grid; gap: 4px; }

/* Game screen. */
#game { display: grid; gap: 10px; }
.hud { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.hud .clock { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hud .stats { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.stat { display: flex; gap: 6px; align-items: center; }
.speeds { display: flex; gap: 4px; }
.speeds .btn { padding: 6px 8px; }
.badge { font-family: var(--display); font-size: 9px; letter-spacing: 0.08em; padding: 5px 7px; border: 2px solid var(--ink0); }
.badge.live { background: var(--red); color: var(--paper); box-shadow: inset 2px 2px 0 #f07a6a; }
.badge.test { background: var(--gold); color: var(--ink0); }
.badge.watch { background: var(--ink3); color: var(--mist); }
@media (prefers-reduced-motion: no-preference) { .badge.live { animation: pulse 2s steps(2, end) infinite; } }
@keyframes pulse { 50% { background: #a8352a; } }
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 10px; align-items: start; }
.mapwrap { position: relative; background: var(--ink0); border: 2px solid var(--ink0); box-shadow: 0 0 0 2px var(--ink3); overflow: hidden; display: flex; justify-content: center; }
#map { width: 100%; height: auto; cursor: crosshair; max-width: 100%; touch-action: none; }
.mapzoom { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; align-items: center; background: rgba(10,13,24,0.7); padding: 4px; }
.mapzoom .btn { padding: 5px 8px; font-size: 11px; }
.mapzoom .label { min-width: 3.2em; text-align: center; color: var(--mist); }
#tip { position: absolute; pointer-events: none; background: var(--ink0); border: 2px solid var(--amber); padding: 4px 6px; font-size: 14px; white-space: nowrap; }
.maplegend { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 10px; font-family: var(--display); font-size: 8px; color: var(--mist); background: rgba(10,13,24,0.7); padding: 4px 6px; }
.dot { display: inline-block; width: 6px; height: 6px; margin-right: 4px; vertical-align: middle; }
.side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs .btn { flex: 1 1 auto; }
#panel { max-height: calc(100vh - 160px); overflow: auto; min-height: 200px; }
.card { border: 2px solid var(--ink3); background: var(--ink1); padding: 10px; display: grid; gap: 8px; }
.card.sel { border-color: var(--cyan); }
.truckhead { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 15px; }
.kv dt { color: var(--fog); }
.kv dd { margin: 0; }
.loads { display: grid; gap: 6px; }
.load { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px; border: 2px solid var(--ink3); background: var(--ink1); }
.load.mine { border-color: var(--lime); }
.lane { font-family: var(--display); font-size: 10px; letter-spacing: 0.04em; }
.lane .arrow { color: var(--fog); font-size: 8px; }
.ticker { display: flex; gap: 18px; overflow: hidden; white-space: nowrap; font-size: 15px; border-top: 2px solid var(--ink3); padding-top: 6px; min-height: 24px; }
.ticker span { flex: none; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink0); border: 2px solid var(--amber); padding: 8px 12px; max-width: min(360px, calc(100vw - 32px)); z-index: 20; }
.toast.err { border-color: var(--red); }
.spark { display: block; width: 100%; height: 48px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
.guide ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }
.guide p { margin: 0; font-size: 15px; }
.guide h4 { margin: 4px 0 0; font-family: var(--display); font-weight: 400; font-size: 9px; color: var(--amber); letter-spacing: 0.04em; }
.guide a, .stack a { color: var(--cyan); }
.guidenav { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.guidenav .label { width: 100%; }
.stars { color: var(--gold); letter-spacing: 1px; }
td, th { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--ink3); }
th { font-family: var(--display); font-size: 8px; color: var(--fog); font-weight: 400; }
tr.you td { color: var(--cyan); }
.progress { width: min(100%, 420px); height: 14px; border: 2px solid var(--ink3); background: var(--ink0); }
.progress > i { display: block; height: 100%; background: var(--amber); width: 0; }
@media (max-width: 1240px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  #panel { max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<div id="app">
  <section id="title">
    <canvas id="titleCanvas" width="768" height="432" aria-label="A truck driving a desert highway at dusk"></canvas>
    <div class="logo">LANES</div>
    <p class="tagline">One shared world on the real clock. Bid the board. Build the fleet.</p>
    <div class="menu" id="menu"></div>
  </section>
  <section id="loading" hidden>
    <div class="stack" style="align-items:center;padding-top:20vh">
      <h2 id="loadtitle">Catching up</h2>
      <p class="muted" id="loadnote"></p>
      <div class="progress"><i id="loadbar"></i></div>
    </div>
  </section>
  <section id="game" hidden>
    <header class="hud panel" id="hud"></header>
    <main class="board">
      <div class="mapwrap" id="mapwrap">
        <canvas id="map" width="400" height="248" aria-label="Map of hubs and trucks"></canvas>
        <div id="tip" hidden></div>
        <div class="mapzoom" role="group" aria-label="Map zoom"><button class="btn" id="zoomout" title="Zoom out (-)" aria-label="Zoom out">-</button><span class="label" id="zoomlevel" aria-live="polite">1×</span><button class="btn" id="zoomin" title="Zoom in (+, wheel or double-click)" aria-label="Zoom in">+</button><button class="btn" id="zoomfit" title="Whole map (0)">Fit</button></div>
        <div class="maplegend"><span><i class="dot" style="background:var(--cyan)"></i>Your trucks</span><span><i class="dot" style="background:var(--lime)"></i>Other players</span><span><i class="dot" style="background:var(--paper)"></i>AI carriers</span></div>
      </div>
      <aside class="side">
        <nav class="tabs" id="tabs"></nav>
        <div class="panel" id="panel"></div>
      </aside>
    </main>
    <footer class="ticker" id="ticker" aria-live="polite"></footer>
  </section>
  <div class="toast" id="toast" hidden></div>
</div>

s a market ships more than it takes in: easy reloads. Below 1, trucks pile up and outbound pays little. The join screen shows each hub's crowding and yard rent live.")},{id:"leasing",section:Lt,title:"Leasing",html:Y([`<b>Your first truck</b> is an NPC lease: a Workhorse with a dry van. The lessor takes ${P(e.costs.npcLeaseShareOfGross)} of every load's pay and pays for major repairs.`,`<b>Extra leases</b>, once you own a truck: any trailer, no money down, the same ${P(e.costs.npcLeaseShareOfGross)}, at least ${W(t.minWeeklyFd)} FD a week, a ${t.minTermDays}-day minimum term, up to ${t.maxPerCompany} at a time. You hire a driver for each.`,"The lessor's fleet grows when nearly all of it is out and freight is going uncovered, and shrinks when leases come back, so in a boom you may find none left."])},{id:"buying",section:Lt,title:"Buying trucks",html:K(["","List price","mpg","Breakdowns","Maintenance FD/mi"],["workhorse","highwayPro","flagship"].map(s=>[s==="workhorse"?"Workhorse":s==="highwayPro"?"Highway Pro":"Flagship",`${W(e.dealerFd.tractor[s])} FD`,e.tractors[s].mpg,`\xD7${e.tractors[s].breakdownMult}`,e.tractors[s].maintPerMile.toFixed(2)]))+T(`Trailers: dry van ${W(e.dealerFd.trailer.van)} FD, reefer ${W(e.dealerFd.trailer.reefer)}, flatbed ${W(e.dealerFd.trailer.flatbed)}.`)+Ie("Prices move")+T(`Each tractor tier and trailer type has its own price index. Every month it moves a third of the way toward a target: up ${P(e.dealerPrices.backlogWeight)} as the dealer's backlog doubles the wait, up as supply runs short (fewer than ${P(e.dealerPrices.scarceBelow)} of the cap left) and down when there's plenty, within \xD7${e.dealerPrices.range[0]}\u2013${e.dealerPrices.range[1]} of list. Used values move with new prices. Buying into a boom costs more.`)+Ie("Delivery and supply")+Y([`You pay when you order. The truck arrives ${r.baseDays} days later, plus a day for every ${W(1/r.daysPerPendingOrder)} trucks already on order nationally (up to ${r.maxDays}). Orders placed in a boom often land as it turns.`,`Supply is capped: ${W(e.tractors.workhorse.pocCap)} Workhorses, ${W(e.tractors.highwayPro.pocCap)} Highway Pros and ${W(e.tractors.flagship.pocCap)} Flagships in the whole world. ${P(e.starterReserveShare)} of Workhorses and dry vans are held for companies buying their first truck.`,`Ordering a first truck while on the NPC lease replaces the lease when it arrives. A company can run up to ${e.company.maxTrucks} trucks.`])},{id:"used",section:Lt,title:"The used market",html:T(`List an idle owned truck at an asking price, a floor, and a weekly price cut; a buyer gets it today, where it stands. The seller gets ${P(1-e.usedMarket.feePct)} and ${P(e.usedMarket.feePct)} is burned.`)+T(`A truck's value falls with mileage (to ${P(e.depreciation.floorPct)} of new at ${W(e.depreciation.lifetimeMiles)} miles), ${P(e.depreciation.perYear)} a year with age, and up to ${P(e.depreciation.conditionWeight)} more for wear, all against what the same truck costs new today.`)},{id:"finance",section:Lt,title:"Equipment Finance",html:Y([`<b>Borrow</b> up to ${P(n.maxLoanToValue)} of an owned truck's value at ${P(n.weeklyRate)} a week, repaid over ${n.termWeeks} weeks.`,`<b>Miss ${n.missedPaymentsToRepossess} payments</b> and the truck is repossessed and sold; depositors absorb any shortfall.`,"<b>Deposit</b> spare FD to earn the interest borrowers pay. Idle cash in the pool pays the holding cost like any other."])},{id:"overhead",section:Lt,title:"Overhead and parking",html:T("Running a fleet costs more than its trucks. Each week every truck past your third pays overhead by bracket:")+K(["Truck number","FD a week each"],e.fleetOverhead.brackets.map((s,i,d)=>[`${s.fromTruck}${d[i+1]?`\u2013${d[i+1].fromTruck-1}`:"+"}`,W(s.weeklyFd)]))+T(`A <b>parked</b> truck is off the road: no overhead, no insurance, no driver needed, but it still pays yard rent, and an owned truck unused for ${e.costs.idleFeeAfterDays}+ days pays ${e.costs.idleFeePerDay} FD a day. Dispatcher pay and yard rent are on top (${z("dispatchers","Dispatchers")}, ${z("home","Choosing a home hub")}).`)},{id:"facilities",section:Lt,title:"Facilities: becoming a shipper",html:T(`Any company can buy a facility and post its own freight. The NPC market buys the goods on delivery; you pay the carrier and keep the margin, plus ${e.facilities.shipperMilesPerMile} Miles per mile shipped.`)+K(["","Price","Upkeep/week","Loads/round","Freight"],["warehouse","coldStorage","factory"].map(s=>{let i=e.facilities.types[s];return[s==="coldStorage"?"Cold storage":s[0].toUpperCase()+s.slice(1),`${W(i.priceFd)} FD`,`${W(i.upkeepPerWeekFd)} FD`,i.loadsPerRound,i.equipment==="bySector"?"by the hub's industry":i.equipment]}))+T(`Your freight takes over part of the hub's NPC demand (NPCs always keep at least ${P(1-e.facilities.maxPlayerShareOfHub)}). Freight nobody hauls after ${e.facilities.expediteAfterRounds} rounds goes to an NPC expediter at the ceiling plus ${P(e.facilities.expeditePremium-1)}, at your cost. Up to ${e.facilities.maxPerCompany} facilities per company.`)}]}var Wt="The market";function ys(e){let t=e.board,r=e.rates,[n,o]=e.time.boardRoundHours;return[{id:"board",section:Wt,title:"The load board",html:T(`Freight is sold in sealed-bid rounds at ${String(n).padStart(2,"0")}:00 and ${o}:00. Each load has a <b>ceiling</b>, the most its poster will pay per mile. You bid at or under it; nobody sees anyone else's bid.`)+Ie("How a round clears")+Y([`Every bid gets a score: ${P(t.scoreWeights.price)} for price (how far under the ceiling), ${P(t.scoreWeights.reputation)} for reputation (your on-time record), ${P(t.scoreWeights.deadhead)} for empty miles to the pickup (none is best, ${t.deadheadScaleMi} or more scores zero).`,"Bids clear best score first. A truck wins at most one load a round, and a load goes to one truck.",`A load nobody takes rolls to the next round with its ceiling up ${P(t.rolloverCeilingStep)}. After ${t.npcFallbackAfterRounds} rounds an NPC carrier takes NPC freight; a player shipper's freight goes to an NPC expediter at its cost.`])+Ie("Bidding by hand")+Y([`Pick an idle truck and a load up to ${It} miles away with the right trailer. One bid per truck per round; you can rebid or withdraw until it clears.`,"A hand bid replaces your dispatcher's bids for that truck that round.",`The board shows your break-even for each load: fuel, wages, maintenance, insurance, expected repairs, the lessor's cut, the empty miles to the pickup, and the empty miles you'll likely run after delivering (${z("reload","reload odds")}).`])+T(`Posters pay a ${P(t.posterFeePct)} board fee on what the freight pays them. Carriers pay nothing to bid.`)},{id:"rates",section:Wt,title:"How shippers price freight",html:T(`NPC shippers post at a reference rate. It starts from the lane's base rate: ${r.baseRatePerMile.toFixed(2)} FD/mi for a dry van, plus ${r.shortHaulBonus} FD \xF7 miles on short hauls. Then it's multiplied by:`)+Y([`<b>Tightness:</b> the load-to-truck ratio within ${e.map.nearbyRadiusMi} miles of the origin for that trailer type, to the power ${r.ratioExponent} (kept within ${r.ratioClamp[0]}\u2013${r.ratioClamp[1]}). Idle trucks that wouldn't take today's rates don't count as supply.`,"<b>Weather</b> at the origin.",`<b>Trailer:</b> reefer \xD7${r.equipmentPremium.reefer}, flatbed \xD7${r.equipmentPremium.flatbed}.`,`<b>Season</b> at the origin (${z("seasons","Seasons")}).`,`<b>Destination:</b> freight into a market where trucks pile up pays more (${z("reload","reload odds")}).`])+T(`A fuel surcharge passes on ${P(e.fuel.surchargePassThrough)} of diesel's move above ${e.fuel.baseFd.toFixed(2)} FD/gal (at ${e.fuel.surchargeMpg} mpg). The ceiling is the reference rate plus ${P(r.npcCeilingMarkup-1)}. Most loads clear somewhere between the two.`)},{id:"reload",section:Wt,title:"Headhaul, backhaul and reload odds",html:T("Some markets consume far more than they ship. Miami takes in plenty and sends little out, so trucks pile up there and wait. Freight <i>into</i> Miami is the headhaul and pays well; freight <i>out</i> is the backhaul and barely pays. Producing markets work the other way.")+T("<b>Reload odds</b> combine a market's balance for each trailer type with how tight it has been lately against the national average, smoothed over about a week. Every load shows its destination's odds:")+K(["Label","Odds","Means"],[["Good","\u2265 1.25","Easy to reload; freight in pays a bit less"],["Fair","0.8\u20131.25","About average"],["Poor","< 0.8","Expect empty miles; freight in pays more"]])+T(`Expected empty miles after delivery are ${t.reloadDeadheadMi} \xF7 the odds, between ${t.reloadDeadheadClamp[0]} and ${t.reloadDeadheadClamp[1]}. The destination's price factor is odds<sup>\u2212${r.reloadExponent}</sup>, within \xD7${r.reloadClamp[0]}\u2013${r.reloadClamp[1]}. A cheap load into a good market can beat a rich one into a dead end.`)},{id:"seasons",section:Wt,title:"Seasons",html:T(`Every market has its own freight season, from the regional curves on beagl.ai's seasonality map: a slow build, a peak, a steep fall, then a dead zone. Each hub follows the nearest market's curve for dry van and reefer; flatbed follows the van curve at ${P(r.seasons.flatbedFromVan)} strength.`)+Y(["South Florida produce builds slowly from winter, runs hot from late April through May, falls steeply in June and stays dead into autumn.","Georgia and the Carolinas pick up in June as Florida fades; the West and North run later in summer and fall.","Dry van and flatbed rise with produce season too, and northern markets tighten in winter.",`Late December volume drops to ${P(r.seasons.lateDecVolume)} for the holidays.`])+T(`A season moves freight volume (\xD7${r.seasons.volumeClamp[0]}\u2013${r.seasons.volumeClamp[1]}) and the posted rate (\xD7${r.seasons.rateClamp[0]}\u2013${r.seasons.rateClamp[1]}), and more freight tightens the market on top. The edge is timing: be where the season is going before the rates show it. The Company tab's <i>Seasons now</i> card shows the hottest and coldest markets; each load shows its origin's season.`)},{id:"cycle",section:Wt,title:"Booms, busts and stabilizers",html:T("National freight demand follows a Cass-style cycle. The Company tab shows the demand dial: above 1.1 is a boom (more freight, higher rates), below 0.9 a slump. Booms invite everyone to buy trucks; the trucks arrive after the dealer's lead time, often as the market turns.")+T(`Published stabilizers keep the money supply in check. Each month NPC freight volume moves up to ${P(e.stabilizers.volumeStepPerMonth)} (within \xD7${e.stabilizers.volumeRange[0]}\u2013${e.stabilizers.volumeRange[1]}) and the diesel rack spread up to ${P(e.stabilizers.rackStepPerMonth)} (within \xB1${P(e.stabilizers.rackSpreadBand)}), toward FD sinks matching faucets. After the token launches the profit tax moves first (${z("token","The token")}).`)},{id:"fuel",section:Wt,title:"Fuel",html:T(`Diesel starts at ${e.fuel.baseFd.toFixed(2)} FD a gallon and follows real diesel prices at half strength, within \xB1${P(e.fuel.clamp[1]-1)}, times the rack spread. Your fuel bill is miles \xF7 mpg \xD7 price: a Workhorse gets ${e.tractors.workhorse.mpg} mpg, a Highway Pro ${e.tractors.highwayPro.mpg}, a Flagship ${e.tractors.flagship.mpg}. Wear costs up to ${P(e.wear.mpgLossWorn)} of that, million-mile trucks gain up to ${P(e.wear.maxFuelBonus)}, and your driver moves it \xB1${P(e.labor.driver.mpgRange/2)}. The fuel surcharge on every load passes most of a price spike to shippers.`)},{id:"brokers",section:Wt,title:"Brokers and contracts",html:T(`About ${P(e.freight.npcBrokerOnlyShare)} of NPC freight is tendered to AI brokers at contract rates, which trail the spot market by about ${e.brokerRisk.contractLagDays} days. A broker reposts the load at its margin (typically 6\u201312%) and pays the carrier whatever the shipper does. In a spike, brokers pay carriers more than their contracts bring in; in a slide, the contracts pad their margin.`)+T(`Some shippers don't pay their brokers (about ${P(e.brokerRisk.defaultRate)} of loads, more in a slump). The broker still pays its carrier. Brokers choose which carriers they'll load: see ${z("vetting","Vetting")}.`)}]}var Kt="Money";function bs(e){let t=e.insurance,r=e.token,n=e.miles;return[{id:"fd",section:Kt,title:"Where FD comes from and goes",html:T("Freight Dollars (FD) are the game's money. Every FD movement is double-entry: it comes from somewhere and goes somewhere.")+Y(["<b>In:</b> NPC shippers paying for freight, the NPC market buying facility goods, starting grants, and (after launch) FD bought with dollars.","<b>Out (burned):</b> fuel, wages, maintenance and repairs, insurance, yard rent, overhead, dispatcher pay, lease shares, the dealer, fines and judgments, board fees, the holding cost, the profit tax after launch.","<b>Between companies:</b> brokers and shippers paying carriers, used-truck sales, loans and deposits."])+T(`The Company tab's market report shows the freight cycle and rates; stabilizers keep what's burned close to what's created (${z("cycle","Booms, busts and stabilizers")}).`)},{id:"insurance",section:Kt,title:"Insurance",html:T("Every company holds a one-game-year policy, priced when it's signed and fixed for the term, billed weekly for each truck on the road. It renews at the then-current price.")+T(`<b>Price per truck per year</b> = ${W(t.baseAnnualPerTruck)} FD \xD7 your record \xD7 your home hub's garaging factor \xD7 the insurance market.`)+K(["Your record","Factor"],[["New authority (not yet rated)",`\xD7${t.rating.none}`],["Satisfactory",`\xD7${t.rating.satisfactory}`],["Conditional",`\xD7${t.rating.conditional}`],["Unsatisfactory",`\xD7${t.rating.unsatisfactory}`],["Each safety alert",`+${P(t.perAlert)}`],["At-fault crashes",`+25% (property), +60% (injury), +150% (fatal), wearing off ${P(e.safety.crash.surchargeDecayPerMonth)} a month`],[`Satisfactory, no crashes or alerts, ${t.cleanYears}+ years`,`\xD7${t.cleanDiscount}`]])+Y([`The record factor stays within \xD7${t.clamp[0]}\u2013${t.clamp[1]}.`,`<b>Garaging:</b> where you're based. Florida, Louisiana, New Jersey, Texas, Georgia and California cost more; the upper Midwest and Mountain West less (${z("home","Choosing a home hub")}).`,`<b>The market:</b> when insurers pay out more than ${P(t.market.targetLossRatio)} of what they take in over a year, the market hardens ${P(t.market.stepPerMonth)} a month, and softens when they pay out less, within \xD7${t.market.range[0]}\u2013${t.market.range[1]}. Everyone's crashes move everyone's rates.`,"<b>Mid-term:</b> after an at-fault crash with injuries or deaths, or a review that changes your rating (including a new authority's first clean audit), your insurer re-writes the policy at the new price for a new year.",`Dispatchers spread the premium over a typical truck's ${W(t.loadedMilesPerYear)} loaded miles a year when they price loads.`])},{id:"holding",section:Kt,title:"The holding cost",html:T(`Cash isn't free to sit on. Each week ${P(e.holdingCost.weeklyRate)} of any cash above your working capital is burned. Working capital is the larger of ${W(e.holdingCost.minProtectedFd)} FD and what you spent in the last four weeks, so a buffer for a bust is free and a hoard isn't. Put spare FD to work: trucks, facilities, or Equipment Finance loans to others.`)},{id:"broke",section:Kt,title:"Going broke",html:Y([`More than ${W(e.insolvency.debtLimitFd)} FD in the red at ${e.insolvency.weeksInDebt} weekly checks in a row and the company is liquidated: bidding stops, staff are let go, owned trucks are fire-sold (from ${P(e.insolvency.fireSaleStartPctOfValue)} of value, down ${P(e.insolvency.fireSaleStepPctOfValue)} a week), facilities close, and extra leases go back.`,"A judgment bigger than the company can pay winds it up the same way.","Then you start over on the NPC lease with whatever is left, no grant. Debts are written off, your reputation starts fresh, and any airdrop not yet unlocked is forfeited."])},{id:"miles",section:Kt,title:"Miles",html:T("Miles are points for hauling well, and they become the airdrop at launch. Each delivered load earns its loaded miles \xD7:")+Y([`<b>On time:</b> early (${e.freight.earlyThresholdMinutes/60}+ hours) \xD7${n.onTime.early}, on time \xD7${n.onTime.onTime}, late \xD7${n.onTime.late};`,`<b>Margin:</b> your margin \xF7 ${P(n.marginTarget)}, within \xD7${n.marginClamp[0]}\u2013${n.marginClamp[1]};`,`<b>Reputation level:</b> \xD7${n.reputationRange[0]}\u2013${n.reputationRange[1]};`,`<b>Truck ladder:</b> your first truck \xD7${e.company.truckLadder[0]}, then ${e.company.truckLadder.slice(1).join(", ")}, then \xD7${e.company.truckLadderFloor} for every truck after.`])+T(`No Miles for a load that cleared more than ${P(n.rateOutlierPct)} off its reference rate (a hot load's premium counts as its reference). At most ${W(n.dailyCapPerCompany)} Miles a day per company, and only the first ${n.maxLoadsPerLanePairPerDay} loads a day on the same lane count. Brokers earn ${n.brokerPerMile} per mile brokered.`)},{id:"token",section:Kt,title:"The token",html:Ie("Beta")+T(`The first ${r.betaYears} game years are the beta: FD is play money and Miles pile up.`)+Ie("Launch")+Y(["FD above each company's working capital is burned; what's kept is locked: it can be spent in the game, not sold.",`An FD/USDC pool opens at $${r.launch.priceUsd} per FD with ${W(r.launch.seedUsd)} dollars of protocol-owned liquidity.`,`<b>Airdrop:</b> ${W(r.airdrop.fd)} FD shared by Miles, at most ${P(r.airdrop.capShare)} to any one company. ${P(r.airdrop.atLaunch)} unlocks at launch; the rest over ${r.airdrop.unlockWeeks} weeks, a slice each week you handle at least ${r.airdrop.loadsPerWeek} loads (a missed week's slice is forfeited). Or claim the rest at once for ${P(1-r.airdrop.instantClaimHaircut)} of it.`])+Ie("After launch")+Y([`Buy FD with dollars (${P(r.exchange.buyFeePct)} fee) or sell unlocked FD (${P(r.exchange.sellFeePct)} fee, burned) on the Money tab.`,`<b>Profit tax:</b> ${P(r.profitTaxRate)} of each week's operating profit above ${W(r.profitTaxAllowanceFd)} FD is burned. The rate moves ${P(r.taxStabilizer.stepPerMonth)} a month within ${P(r.taxStabilizer.range[0])}\u2013${P(r.taxStabilizer.range[1])} to keep the money supply steady.`,"Half of the game's revenue buys FD back from the pool and burns it."])}]}var vr="Running trucks";function gs(e){let t=e.labor,r=e.hos,n=e.safety.hotLoads,o=e.wear,a=e.breakdowns;return[{id:"dispatch",section:vr,title:"You against your dispatcher",html:T("Standing orders are your dispatcher's rules. Whoever dispatches (you as owner, plus any dispatchers you hire) runs them every round for every idle truck you didn't bid on by hand. Their skill decides how well:")+Y([`<b>Pricing:</b> they misjudge their own costs by about ${P(t.dispatcher.noise[0])} when green and ${P(t.dispatcher.noise[1])} at their best. The loads they win are disproportionately the ones they underpriced.`,`<b>Reload awareness:</b> they price in ${t.dispatcher.reloadAware[0]}\xD7 to ${t.dispatcher.reloadAware[1]}\xD7 of the empty run out of a destination.`,`<b>Foresight:</b> they look 0 to ${t.dispatcher.foresightDays[1]} days ahead on each market's season when pricing loads and moving idle trucks.`,`<b>Span:</b> you can run ${t.owner.span} trucks; a hired dispatcher ${t.dispatcher.span[0]}\u2013${t.dispatcher.span[1]}. Past the team's span, some idle trucks sit out each round.`])+T("<b>You can always beat the best of them by hand.</b> You see everything they see: exact ceilings, reload odds, every market's season a year out, and where the AI is crowding. You aren't held to their rule set or their mistakes. The Staff tab shows your team's numbers.")},{id:"orders",section:vr,title:"Standing orders",html:T("Set them at the bottom of the Fleet tab. They're the same rules the AI companies use.")+K(["Rule","What it does"],[["Bid at break-even plus %","Asks your break-even on the load plus a margin, capped at the ceiling"],["Bid at % of the ceiling","Asks a share of the posted ceiling, whatever it costs you"],["Never below break-even +","A floor: skips any load that wouldn't clear it"],["Max empty miles","How far a truck will run empty to a pickup (up to 150)"],["Move idle trucks","After a number of idle rounds, sends the truck empty to the hub nearby with the most uncovered freight for its trailer"]])+T(`Each truck bids on up to ${e.board.maxBidsPerTruckPerRound} loads a round, most profitable first; it wins at most one. You get ${e.board.freeStandingOrders} standing orders plus a floor.`)},{id:"hours",section:vr,title:"Hours, dock time and delivery windows",html:Y([`A driver gets ${r.drivingHoursPerDay} driving hours in a 24-hour duty day that opens when the truck first rolls: about ${r.drivingHoursPerDay*r.avgMph} miles at ${r.avgMph} mph (your driver's skill moves speed \xB1${P(t.driver.mphRange/2)}). A team of two drivers gets ${e.safety.hos.teamHours}.`,`Loading and unloading take ${e.dwell.loadMinutes[0]/60}\u2013${e.dwell.loadMinutes[1]/60} hours each, on duty but not driving.`,`A load is due after the drive at the legal pace, the worst-case dock time and ${e.freight.deliverySlackMinutes/60} hours of slack. ${e.freight.earlyThresholdMinutes/60} hours early or more counts as early; past due is late.`,`A breakdown stops the truck ${a.delayHours[0]}\u2013${a.delayHours[1]} hours and can make it late.`])+Ie("Hot loads")+T(`About ${P(n.share)} of long-haul freight (500 miles or more) is hot: it pays ${n.premium[0]}\u2013${n.premium[1]}\xD7 for a window that assumes ${n.hoursPerDay} driving hours a day with only ${n.slackMinutes/60} hours of slack. A solo driver can't make it legally; a team can. Delivered late, a hot load pays only ${P(n.lateKeepsPremium)} of its premium. Hot loads are at least standard-vetted.`)},{id:"reputation",section:vr,title:"Reputation and on-time",html:T(`Your reputation is your smoothed on-time rate: a new company counts as ${e.reputation.priorLoads} loads at ${P(e.reputation.start)}, then every delivery moves it. It's ${P(e.board.scoreWeights.reputation)} of every bid's score, so a good record wins loads at higher rates.`)+T(`Your level is the square root of loads delivered \xF7 ${e.reputation.loadsPerLevelSq}, up to ${e.reputation.maxLevel}, and it multiplies the Miles you earn (\xD7${e.miles.reputationRange[0]}\u2013${e.miles.reputationRange[1]}). Going broke resets both.`)},{id:"wear",section:vr,title:"Wear, breakdowns and rebuilds",html:Y([`An owned truck's condition falls from 100% to 0 over ${W(o.lifeMiles)} miles since its last rebuild. Fully worn, it burns ${P(1/(1-o.mpgLossWorn)-1)} more fuel and doubles maintenance.`,`Breakdowns: a new Workhorse about once every ${W(1e3/a.per1000MiNew)} miles, \xD7(1 + ${a.wornMultiplier}\xB7wear\xB2) as it wears and more as it ages; a Highway Pro breaks down ${P(1-e.tractors.highwayPro.breakdownMult)} less, a Flagship ${P(1-e.tractors.flagship.breakdownMult)} less. Each costs ${W(a.repairFd[0])}\u2013${W(a.repairFd[1])} FD on an owned truck; the lessor pays on a leased one. A skilled driver means fewer.`,`<b>Rebuild</b> an idle owned truck at ${P(o.rebuildMaxCondition)} condition or worse: ${o.rebuildDays} days in the shop, back to 100%. It costs ${W(o.rebuildFd.workhorse)} FD for a Workhorse (${W(o.rebuildFd.highwayPro)} Highway Pro, ${W(o.rebuildFd.flagship)} Flagship), more the higher the odometer: double at ${W(o.rebuildAgeMi)} miles.`,"A worn truck's break-even is higher, so it loses bids to fresher trucks. That, not a rule, is the reason to rebuild.",`<b>Million-mile trucks:</b> a level every ${W(o.milesPerLevel)} miles, up to ${o.maxLevel}; every five levels adds ${P(o.fuelBonusPerFiveLevels)} fuel economy, up to ${P(o.maxFuelBonus)}.`,`Defects (worn brakes, tires, lights) build up slowly on any truck, faster if maintenance is skipped. They raise breakdown and crash odds and get trucks put out of service at inspections. Fix them from the Fleet tab for ${W(e.safety.maintenance.fixFdPerDefect)} FD each.`])}]}var Mo="Reference";function ks(e){let[t,r]=e.time.boardRoundHours;return[{id:"numbers",section:Mo,title:"Numbers at a glance",html:K(["",""],[["A game day (live)",`${e.time.realHoursPerGameDayLive} real hours`],["Board rounds",`${String(t).padStart(2,"0")}:00 and ${r}:00`],["Starting cash",`${W(e.company.startingGrantFd)} FD`],["NPC lease",`${P(e.costs.npcLeaseShareOfGross)} of each load's pay`],["Workhorse + dry van, list",`${W(e.dealerFd.tractor.workhorse+e.dealerFd.trailer.van)} FD`],["Dealer lead time",`${e.dealerDelivery.baseDays}+ days`],["Driving per duty day",`${e.hos.drivingHoursPerDay} h solo, ${e.safety.hos.teamHours} h team`],["Average speed",`${e.hos.avgMph} mph`],["Diesel base",`${e.fuel.baseFd.toFixed(2)} FD/gal`],["Driver market pay",`${e.labor.driver.payPerMile[0].toFixed(2)}\u2013${e.labor.driver.payPerMile[1].toFixed(2)} FD/mi`],["Dispatcher pay (full span)",`${W(e.labor.dispatcher.payPerWeek[0])}\u2013${W(e.labor.dispatcher.payPerWeek[1])} FD/wk`],["Insurance base",`${W(e.insurance.baseAnnualPerTruck)} FD per truck per year`],["Yard rent base",`${e.homeBase.yardPerTruckWeek} FD per truck per week`],["Trucks you dispatch yourself",e.labor.owner.span],["Truck cap per company",e.company.maxTrucks],["Insolvency",`${W(e.insolvency.debtLimitFd)} FD in the red, ${e.insolvency.weeksInDebt} weeks running`],["Token launch",`end of year ${e.token.betaYears}`]])},{id:"glossary",section:Mo,title:"Glossary",html:K(["Term","Meaning"],[["Backhaul","The return trip out of a market that takes in more than it ships: cheap freight"],["Break-even","The rate per mile that just covers a load's costs, including the empty miles before and after"],["Ceiling","The most a poster will pay per mile for a load"],["Deadhead","Miles driven empty"],["Duty day","The 24 hours from when a truck first rolls; driving hours reset after it"],["FD","Freight Dollars, the game's money"],["FSC","Fuel surcharge, paid on top of the linehaul rate"],["Garaging","Where a carrier is based, for insurance"],["Headhaul","Freight into a market that takes in more than it ships: well paid"],["Hot load","Freight with a tight window, at a premium"],["Load-to-truck ratio","Loads posted against trucks available nearby; higher means tighter, better-paying"],["Miles","Points earned for hauling well, converted to the airdrop at launch"],["Out of service","Ordered off the road at an inspection until a problem is fixed"],["Reload odds","How easily a truck finds its next load after delivering at a hub"],["Span","How many trucks a dispatcher can run"],["Standing orders","Your dispatcher's rules for bidding and moving trucks"],["Vetting","A poster's requirements for who may haul its freight"]])},{id:"faq",section:Mo,title:"Questions",html:T(`<b>Why did I lose a bid at a lower rate than the winner?</b> Price is ${P(e.board.scoreWeights.price)} of the score; reputation, empty miles and the home-market edge make up the rest.`)+T("<b>Why are my trucks sitting idle?</b> No freight in range that clears your floor, no driver, or your fleet is past your dispatch team's span (the Staff tab says which).")+T("<b>Why did my insurance go up?</b> A renewal re-prices it: check the Company tab for your record, garaging and the market. A serious crash or a bad rating re-writes it at once.")+T(`<b>Can I pause the live world?</b> No. Only test worlds pause. See ${z("worlds","The live world and test worlds")}.`)+T(`<b>Is a hired dispatcher better than me?</b> Never better than your own bids by hand. See ${z("dispatch","You against your dispatcher")}.`)}]}var Xt="Safety and the law";function vs(e){let t=e.safety,r=t.score.thresholds,n=t.review,o=t.crash,a=e.fraud.vetting;return[{id:"record",section:Xt,title:"Your safety record",html:T("Like a real carrier, your company is scored in four areas. Violations count three times as much for six months, twice as much for the next six, once more for the year after, then drop off. Inspections with nothing found dilute the score.")+K(["Area","Alert at"],[["Hours of service",r.hos],["Unsafe driving",r.unsafe],["Vehicle maintenance",r.maintenance],["Crashes (per truck)",r.crash]])+T("An alert gets your trucks pulled into more weigh stations, raises insurance at renewal, keeps strict brokers away, and two at once call in an auditor.")},{id:"inspections",section:Xt,title:"Weigh stations and inspections",html:Y([`Trucks pass weigh stations on the main interstate corridors, at about the real locations. A station is open ${P(t.enforcement.stationOpen)} of the time. Clean carriers are waved through most of the time; alerts, a poor rating or a brand-new authority get pulled in far more.`,"Police make traffic stops on the road, more often for trucks that are speeding.","An inspection checks the driver and logs, the truck, or both. Problems found mean fines, violations on your record, and sometimes an <b>out-of-service order</b> on the spot: the driver must rest, or the truck is repaired at roadside prices before it moves.","Defects build up on every truck, slowly with full maintenance. Fix them from the Fleet tab before an inspector finds them."])+T("Every inspection, clean or not, shows up in your ticker.")},{id:"reviews",section:Xt,title:"Compliance reviews and ratings",html:Y([`A new authority gets a <b>new-entrant audit</b> at ${n.newEntrantDay} days. After that, reviews follow two alerts at once (at most every ${n.alertCooldownDays} days), an at-fault crash with injuries or deaths, or a scheduled follow-up.`,`An auditor goes through your records, fines what turns up (capped at ${W(n.finesCap)} FD a review), and rates you <b>satisfactory</b>, <b>conditional</b> or <b>unsatisfactory</b>.`,`<b>Conditional:</b> insurance \xD7${e.insurance.rating.conditional} at once, strict brokers won't load you, more inspections, and a follow-up in ${n.rereviewDays.conditional} days that can clear it.`,`<b>Unsatisfactory:</b> insurance \xD7${e.insurance.rating.unsatisfactory} at once, most brokers won't load you, and ${n.rereviewDays.unsatisfactory} days to clean up. Still unsatisfactory at the follow-up and your authority is revoked (${z("shutdowns","Shutdowns")}).`,"Bad ratings also cost you people: drivers don't like working for a carrier with a poor rating."])},{id:"crashes",section:Xt,title:"Crashes",html:T(`A typical legal truck crashes about once every ${W(1e6/o.per1MMi)} miles. Fatigue, speed, defects, wear and a green driver all raise the odds; a veteran driver lowers them. About ${P(o.fatalShare)} of crashes kill someone and ${P(o.injuryShare)} injure someone; fatigue or speed makes them deadlier.`)+T("What a crash costs depends on why it happened:")+K(["Cause","What follows"],[["Not at fault","The other side's insurer pays. You lose the load and days in the shop."],["At fault, nothing wrong",`Your insurer pays up to ${W(o.insuranceLimitFd)} FD. You pay the ${W(o.deductibleFd)} FD deductible and anything over the limit; premiums jump at renewal (or at once, for injuries and deaths); a crash on your record.`],["At fault, with violations behind it",`The same, but juries multiply verdicts ${o.negligenceMult[0]}\u2013${o.negligenceMult[1]}\xD7. A verdict the company can't pay winds it up.`],["Fatal, caused by falsified hours or known defects",`A crime. Authority revoked, everything the company has seized, the owner barred for ${t.bars.criminal} days, and the people who ran the truck that way jailed.`]])+T(`A fatal crash usually totals the truck; a leased one costs ${W(o.leasedTotalLossFd)} FD owed to the lessor. A crash with cargo aboard loses the load and its pay, and you pay the cargo deductible.`)},{id:"shutdowns",section:Xt,title:"Shutdowns",html:T("A revoked authority means the fleet is sold off, the staff are let go, Miles and any locked airdrop are forfeited, and the account can't file for new authority until its bar runs out:")+K(["Cause","Bar"],[["Unsatisfactory at the follow-up review",`${t.bars.unsatisfactory} days`],["A second revocation",`${t.bars.imminentHazard} days`],["A crime",`${t.bars.criminal} days, everything seized`],[`${t.permanentAfterCrimes} crimes`,"Barred for good"]])+T("When the bar is over, the account gets new authority and starts over on a lease. Brokers can see the old revocation for a year.")},{id:"vetting",section:Xt,title:"Vetting",html:T("Brokers and shippers choose who may haul their freight. Every load shows its poster's requirement:")+K(["Tier","Requires"],[["Open","Anyone"],["Standard",`Authority at least ${a.standard.minAuthorityDays} days old, no open claims, not rated unsatisfactory`],["Strict",`At least ${a.strict.minAuthorityDays} days and ${a.strict.minDelivered} loads delivered (or a year old), no conditional rating or alerts, no revocation in the past year; tracking on the load`]])+T("Hot loads are at least standard. A new carrier starts on open freight and earns its way up. Open freight draws more bidders, so it tends to clear cheaper.")}]}var fn="Staff";function $s(e){let t=e.labor,r=t.morale,n=[0,.25,.5,.75,1].map((o,a)=>["\u2605".repeat(a+1),`${(t.driver.payPerMile[0]+(t.driver.payPerMile[1]-t.driver.payPerMile[0])*o).toFixed(2)} FD/mi`,`${P(t.driver.mpgRange*(o-.5))}`,`${P(-t.driver.maintRange*(o-.5))}`,`\xD7${(t.driver.crash[0]+(t.driver.crash[1]-t.driver.crash[0])*o).toFixed(1)}`]);return[{id:"drivers",section:fn,title:"Drivers",html:T(`Every truck needs a driver; a truck without one sits. You drive your first truck yourself, at a fixed owner's draw of ${t.owner.driverPayPerMile.toFixed(2)} FD/mi, and you never quit on yourself. Every other seat is a hire.`)+K(["Skill","Market pay","Fuel economy","Maintenance and breakdowns","Crash odds"],n)+T(`Speed moves \xB1${P(t.driver.mphRange/2)} with skill too. Market pay is multiplied by the wage index, which rises up to \xD7${t.wageIndex.range[1]} when the pool of unemployed drivers runs thin and falls to \xD7${t.wageIndex.range[0]} when it's deep.`)+T(`<b>Experience:</b> each mile closes a little of the gap between a driver's skill and their own potential (gap \xD7 miles \xF7 ${W(t.driver.learnMiles)}). A rookie with promise becomes a veteran in a year or two of steady driving, and from then on the market will pay them like one.`)+T(`<b>Teams:</b> seat a co-driver on a truck that already has a driver and it runs ${e.safety.hos.teamHours} hours a day legally. Each driver earns ${P(t.driver.teamPayShare)} of their rate on every mile, so a team costs about ${P(t.driver.teamPayShare*2-1)} more per mile than one driver and covers twice the ground. Teams are how hot loads get delivered legally.`)+T("Every driver carries a record of violations and crashes that any employer can see before hiring.")},{id:"dispatchers",section:fn,title:"Dispatchers",html:T(`You dispatch your first ${t.owner.span} trucks yourself. Past that you need dispatchers, or some of your idle trucks sit out each round. A dispatcher's skill sets how many trucks they can run and how well (${z("dispatch","You against your dispatcher")}):`)+K(["Skill","Runs","Pricing error","Reload priced in","Season foresight","Full-span pay"],[0,.5,1].map(o=>[o===0?"\u2605":o===.5?"\u2605\u2605\u2605":"\u2605\u2605\u2605\u2605\u2605",`${Math.round(t.dispatcher.span[0]+(t.dispatcher.span[1]-t.dispatcher.span[0])*o)} trucks`,`~${P(t.dispatcher.noise[0]+(t.dispatcher.noise[1]-t.dispatcher.noise[0])*o)}`,`${(t.dispatcher.reloadAware[0]+(t.dispatcher.reloadAware[1]-t.dispatcher.reloadAware[0])*o).toFixed(2)}\xD7`,`${Math.round(t.dispatcher.foresightDays[1]*o)} days`,`${W(t.dispatcher.payPerWeek[0]+(t.dispatcher.payPerWeek[1]-t.dispatcher.payPerWeek[0])*o)} FD/wk`]))+T(`Pay is quoted for a full span and billed weekly for the trucks a dispatcher actually runs past your own ${t.owner.span}, with a quarter as a retainer. Your best dispatcher takes the trucks first. Dispatchers learn with every load they book (gap \xD7 loads \xF7 ${W(t.dispatcher.learnLoads)}). So do you: your own dispatching skill grows the same way.`)},{id:"people",section:fn,title:"Hiring, poaching and keeping people",html:Y([`<b>Hiring:</b> anyone in the pool takes a job at their asking pay or more: market pay for their skill, times a personal premium of ${P(t.pool.personal[0]-1)} to ${P(t.pool.personal[1]-1)}. The pool refills every week with rookies and returning veterans.`,`<b>Morale</b> drifts each week toward a target set mostly by pay against market (every 10% under costs about ${P(r.payWeight*.1)}), plus up to ${P(r.tenureCap)} for tenure, minus ${P(r.wornTruckPenalty)} for a worn-out truck, ${P(r.badRatingPenalty)} for a conditional or unsatisfactory safety rating, and up to ${P(r.pushedPenalty)} for running outside the rules, which the best drivers mind most.`,`<b>Quitting:</b> settled people rarely leave; unhappy ones quit at up to about ${P(r.quitBase+r.quitSlope*.5)} a week. A driver left without a truck walks after ${r.unseatedWeeks} weeks. Anyone mid-trip finishes the load first.`,`<b>Poaching:</b> anyone working elsewhere will move for a raise of ${P(r.loyalty[0])} (miserable) to ${P(r.loyalty[1])} (happy) over what they make, and at least their asking pay. Their employer gets ${r.noticeDays} days to match. If they match, they stay.`,"<b>Your people get offers too.</b> The Staff tab flags them with a Match button. Raises keep people; a cut lowers morale on the spot.","Going broke or losing your authority lets everyone go."])},{id:"autostaff",section:fn,title:"Auto-staff",html:T("On by default. Each day it seats any idle driver on a truck that needs one, hires the best-value driver in the pool for any remaining empty seat (asking pay against what their skill saves), hires a dispatcher when your fleet outgrows your team's span, and lets go a dispatcher you no longer need. It doesn't give raises, match offers, or poach: those are yours. Turn it off on the Staff tab to do it all by hand.")}]}var Fo="Getting started";function Ms(e){let[t,r]=e.time.boardRoundHours,n=e.time.realHoursPerGameDayLive;return[{id:"start",section:Fo,title:"Your first week",html:T("LANES is one shared freight market. You run a carrier: you bid on loads, haul them, and grow from one leased truck into a fleet. Every other company is a player or an AI competing for the same freight.")+T(`You start as an owner-operator: one NPC-leased Workhorse with a dry van, ${W(e.company.startingGrantFd)} FD, and you behind the wheel. The lessor takes ${P(e.costs.npcLeaseShareOfGross)} of every load's pay and maintains the truck.`)+Y([`<b>Day 1:</b> open the Load board, pick a load near your truck, and bid. Bids clear at ${String(t).padStart(2,"0")}:00 and ${r}:00 game time.`,"<b>Every day:</b> your dispatcher (you, at first) bids for idle trucks you don't bid on by hand. Set its rules at the bottom of the Fleet tab.",`<b>First goal:</b> save ${W(e.dealerFd.tractor.workhorse+e.dealerFd.trailer.van)} FD for your own Workhorse and dry van. Owning ends the lessor's cut. See ${z("buying","Buying trucks")}.`,`<b>Then:</b> more trucks, drivers to run them (${z("drivers","Drivers")}), a dispatcher once you pass ${e.labor.owner.span} trucks (${z("dispatchers","Dispatchers")}).`])+T(`New authority is on probation: some brokers won't load you until your authority is ${e.fraud.vetting.standard.minAuthorityDays} days old, the strictest not before ${e.fraud.vetting.strict.minAuthorityDays} days and a record. See ${z("vetting","Vetting")}.`)},{id:"worlds",section:Fo,title:"The live world and test worlds",html:T(`<b>The live world</b> is shared by every player and runs on the real clock: a game day every ${n} real hours, a game year about every ${Math.round(e.time.daysPerSeason*n/24)} real days. It never pauses, nothing resets, and every order stands. Your orders reach everyone and take effect about half a real minute later, at the same moment on every screen.`)+T("<b>A test world</b> is a private copy of the rules with only you and the AI in it. You can pause it and run it up to a game day every two seconds. On the
