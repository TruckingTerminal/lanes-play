<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>LANES</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: a dispatcher's console — the map is the window, the side rack holds the paperwork, the ticker runs underneath. */
:root {
  --ink0: #0a0d18; --ink1: #121829; --ink2: #1c2540; --ink3: #2b3a5a; --steel: #475a7c; --fog: #7d8fae; --mist: #b6c4d9;
  --paper: #ece5d3; --amber: #f2a541; --amberD: #c4692a; --gold: #ffd36b; --red: #d6493a; --lime: #a6d65e; --cyan: #7fdcea;
  --display: "Press Start 2P", ui-monospace, Menlo, monospace;
  --body: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --data: "VT323", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ink1); color: var(--paper); font-family: var(--body); font-size: 16px; line-height: 1.35; }
#app { min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
img.px { image-rendering: pixelated; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.num { font-family: var(--data); font-size: 1.25em; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.label { font-family: var(--display); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fog); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-size: 12px; color: var(--amber); letter-spacing: 0.06em; }
h3 { font-size: 10px; color: var(--paper); letter-spacing: 0.04em; }
p { margin: 0; }
.muted { color: var(--fog); }
.good { color: var(--lime); }
.bad { color: var(--red); }
.warn { color: var(--amber); }

/* Chunky beveled panels and buttons. */
.panel { background: var(--ink2); border: 2px solid var(--ink0); box-shadow: inset 2px 2px 0 var(--ink3), inset -2px -2px 0 var(--ink1); padding: 12px; }
.btn { background: var(--ink3); border: 2px solid var(--ink0); box-shadow: inset 2px 2px 0 var(--steel), inset -2px -2px 0 var(--ink2); padding: 6px 10px; cursor: pointer; font-family: var(--display); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--paper); white-space: nowrap; }
.btn:hover { background: var(--steel); }
.btn:active { box-shadow: inset -2px -2px 0 var(--steel), inset 2px 2px 0 var(--ink2); transform: translateY(1px); }
.btn.primary { background: var(--amberD); box-shadow: inset 2px 2px 0 var(--amber), inset -2px -2px 0 #8a4519; color: var(--ink0); }
.btn.primary:hover { background: var(--amber); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.on { background: var(--amber); color: var(--ink0); box-shadow: inset 2px 2px 0 var(--gold), inset -2px -2px 0 var(--amberD); }
input[type=text], input[type=number], select { background: var(--ink0); border: 2px solid var(--ink3); padding: 5px 7px; min-width: 0; }
input[type=number] { width: 6.5em; font-family: var(--data); font-size: 1.2em; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.bar { height: 6px; background: var(--ink0); border: 1px solid var(--ink3); width: 80px; }
.bar > i { display: block; height: 100%; }

/* Title screen. */
#title { display: grid; gap: 16px; justify-items: center; padding-top: 8px; }
#titleCanvas { width: min(100%, 768px); height: auto; aspect-ratio: 16 / 9; border: 2px solid var(--ink0); box-shadow: 0 0 0 2px var(--ink3); }
.logo { font-family: var(--display); font-size: clamp(28px, 7vw, 56px); color: var(--gold); letter-spacing: 0.12em; text-shadow: 4px 4px 0 var(--amberD), 8px 8px 0 var(--ink0); }
.tagline { font-family: var(--display); font-size: 10px; color: var(--mist); letter-spacing: 0.1em; text-align: center; }
.menu { width: min(100%, 560px); display: grid; gap: 12px; }
.choice { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 10px; border: 2px solid var(--ink3); cursor: pointer; background: var(--ink1); }
.choice:has(input:checked) { border-color: var(--amber); background: var(--ink2); }
.choice input { accent-color: var(--amber); }
.field { display: grid; gap: 4px; }

/* Game screen. */
#game { display: grid; gap: 10px; }
.hud { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.hud .clock { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hud .stats { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.stat { display: flex; gap: 6px; align-items: center; }
.speeds { display: flex; gap: 4px; }
.speeds .btn { padding: 6px 8px; }
.badge { font-family: var(--display); font-size: 9px; letter-spacing: 0.08em; padding: 5px 7px; border: 2px solid var(--ink0); }
.badge.live { background: var(--red); color: var(--paper); box-shadow: inset 2px 2px 0 #f07a6a; }
.badge.test { background: var(--gold); color: var(--ink0); }
.badge.watch { background: var(--ink3); color: var(--mist); }
@media (prefers-reduced-motion: no-preference) { .badge.live { animation: pulse 2s steps(2, end) infinite; } }
@keyframes pulse { 50% { background: #a8352a; } }
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 10px; align-items: start; }
.mapwrap { position: relative; background: var(--ink0); border: 2px solid var(--ink0); box-shadow: 0 0 0 2px var(--ink3); overflow: hidden; display: flex; justify-content: center; }
#map { width: 100%; height: auto; cursor: crosshair; max-width: 100%; touch-action: none; }
.mapzoom { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; align-items: center; background: rgba(10,13,24,0.7); padding: 4px; }
.mapzoom .btn { padding: 5px 8px; font-size: 11px; }
.mapzoom .label { min-width: 3.2em; text-align: center; color: var(--mist); }
#tip { position: absolute; pointer-events: none; background: var(--ink0); border: 2px solid var(--amber); padding: 4px 6px; font-size: 14px; white-space: nowrap; }
.maplegend { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 10px; font-family: var(--display); font-size: 8px; color: var(--mist); background: rgba(10,13,24,0.7); padding: 4px 6px; }
.dot { display: inline-block; width: 6px; height: 6px; margin-right: 4px; vertical-align: middle; }
.side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs .btn { flex: 1 1 auto; }
#panel { max-height: calc(100vh - 160px); overflow: auto; min-height: 200px; }
.card { border: 2px solid var(--ink3); background: var(--ink1); padding: 10px; display: grid; gap: 8px; }
.card.sel { border-color: var(--cyan); }
.truckhead { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 15px; }
.kv dt { color: var(--fog); }
.kv dd { margin: 0; }
.loads { display: grid; gap: 6px; }
.load { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px; border: 2px solid var(--ink3); background: var(--ink1); }
.load.mine { border-color: var(--lime); }
.lane { font-family: var(--display); font-size: 10px; letter-spacing: 0.04em; }
.lane .arrow { color: var(--fog); font-size: 8px; }
.ticker { display: flex; gap: 18px; overflow: hidden; white-space: nowrap; font-size: 15px; border-top: 2px solid var(--ink3); padding-top: 6px; min-height: 24px; }
.ticker span { flex: none; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink0); border: 2px solid var(--amber); padding: 8px 12px; max-width: min(360px, calc(100vw - 32px)); z-index: 20; }
.toast.err { border-color: var(--red); }
.spark { display: block; width: 100%; height: 48px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
td, th { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--ink3); }
th { font-family: var(--display); font-size: 8px; color: var(--fog); font-weight: 400; }
tr.you td { color: var(--cyan); }
.progress { width: min(100%, 420px); height: 14px; border: 2px solid var(--ink3); background: var(--ink0); }
.progress > i { display: block; height: 100%; background: var(--amber); width: 0; }
@media (max-width: 1240px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  #panel { max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<div id="app">
  <section id="title">
    <canvas id="titleCanvas" width="768" height="432" aria-label="A truck driving a desert highway at dusk"></canvas>
    <div class="logo">LANES</div>
    <p class="tagline">One shared world on the real clock. Bid the board. Build the fleet.</p>
    <div class="menu" id="menu"></div>
  </section>
  <section id="loading" hidden>
    <div class="stack" style="align-items:center;padding-top:20vh">
      <h2 id="loadtitle">Catching up</h2>
      <p class="muted" id="loadnote"></p>
      <div class="progress"><i id="loadbar"></i></div>
    </div>
  </section>
  <section id="game" hidden>
    <header class="hud panel" id="hud"></header>
    <main class="board">
      <div class="mapwrap" id="mapwrap">
        <canvas id="map" width="400" height="248" aria-label="Map of hubs and trucks"></canvas>
        <div id="tip" hidden></div>
        <div class="mapzoom" role="group" aria-label="Map zoom"><button class="btn" id="zoomout" title="Zoom out (-)" aria-label="Zoom out">-</button><span class="label" id="zoomlevel" aria-live="polite">1×</span><button class="btn" id="zoomin" title="Zoom in (+, wheel or double-click)" aria-label="Zoom in">+</button><button class="btn" id="zoomfit" title="Whole map (0)">Fit</button></div>
        <div class="maplegend"><span><i class="dot" style="background:var(--cyan)"></i>Your trucks</span><span><i class="dot" style="background:var(--lime)"></i>Other players</span><span><i class="dot" style="background:var(--paper)"></i>AI carriers</span></div>
      </div>
      <aside class="side">
        <nav class="tabs" id="tabs"></nav>
        <div class="panel" id="panel"></div>
      </aside>
    </main>
    <footer class="ticker" id="ticker" aria-live="polite"></footer>
  </section>
  <div class="toast" id="toast" hidden></div>
</div>

uck.</b> A new Workhorse and dry van cost ${Ht(e.dealerFd.tractor.workhorse+e.dealerFd.trailer.van)} FD. Owning ends the lessor's cut.`,`<b>Grow.</b> Every truck needs a driver, and past ${n.owner.span} trucks you need a dispatcher (Staff tab).`])+V(`A new authority is on probation: some brokers won't load you until it's ${a.vetting.standard.minAuthorityDays} days old, the strictest not before ${a.vetting.strict.minAuthorityDays} days and a record. See <i>Vetting</i>.`)},{id:"board",title:"The load board",html:V(`Every load has a <b>ceiling</b>, the most the poster pays per mile. Bids go at or under it. The board scores each bid ${me(e.board.scoreWeights.price)} on price, ${me(e.board.scoreWeights.reputation)} on your on-time record and ${me(e.board.scoreWeights.deadhead)} on empty miles to the pickup. The best score wins, one load per truck per round.`)+Be([`A load nobody takes rolls over with its ceiling up ${me(e.board.rolloverCeilingStep)}. After ${e.board.npcFallbackAfterRounds} rounds an NPC carrier takes it.`,`By hand you can bid on loads up to ${Ft} miles away. A hand bid replaces your dispatcher's bids for that truck that round.`,"Your break-even counts fuel, wages, maintenance, insurance, expected repairs, the lessor's cut, the empty miles to the pickup, and the empty miles you'll likely run after delivering."])},{id:"rates",title:"How shippers price freight",html:V(`NPC shippers post at a reference rate: the lane's base rate (about ${e.rates.baseRatePerMile.toFixed(2)} FD/mi for a dry van, more on short hauls) times:`)+Be([`the <b>load-to-truck ratio</b> near the origin for that trailer, to the power ${e.rates.ratioExponent};`,`weather at the origin, and the trailer's premium (reefer \xD7${e.rates.equipmentPremium.reefer}, flatbed \xD7${e.rates.equipmentPremium.flatbed});`,"the origin's <b>season</b> for that trailer;","the destination's <b>reload odds</b>: freight into a dead market pays more, freight into a hot one less."])+V(`On top of that comes a fuel surcharge that passes on ${me(e.fuel.surchargePassThrough)} of diesel above ${e.fuel.baseFd} FD/gal. The ceiling sits ${me(e.rates.npcCeilingMarkup-1)} over the reference rate. Half of NPC freight goes through brokers, whose contract rates trail the spot market by about ${e.brokerRisk.contractLagDays} days.`)},{id:"reload",title:"Headhaul, backhaul and reload odds",html:V("Some markets consume far more than they ship. Miami takes in plenty and sends little out, so trucks pile up there. A carrier hauling into Miami knows it will run empty to reload, so freight into Miami pays more and freight out of it pays less.")+V("Every load shows the <b>reload odds</b> at its destination (good, fair or poor) and the empty miles you'd expect before the next load, and your break-even includes them. A cheap load into a strong market can beat a rich load into a dead end.")},{id:"seasons",title:"Seasons",html:V("Every market has its own freight season, taken from the regional curves on beagl.ai's seasonality map: a slow build, a peak, a steep fall, then a dead zone. South Florida produce builds through spring and peaks in May, Georgia and the Carolinas take over in June, and the West and North run later. Dry vans and flatbeds rise with produce season too.")+V(`Seasons move volume (up to \xD7${e.rates.seasons.volumeClamp[1]}) and rates. The edge is timing: be where the season is going before the rates show it. The Company tab's <i>Seasons now</i> card lists the hottest and coldest markets.`)},{id:"dispatch",title:"Dispatching: you against your dispatcher",html:V("Standing orders are your dispatcher's rules. Whoever dispatches (you as owner, or hired dispatchers) runs them, and their skill decides how well:")+Be([`<b>Pricing:</b> they misjudge their own costs by about ${me(n.dispatcher.noise[0])} when green and ${me(n.dispatcher.noise[1])} at their best.`,`<b>Reload awareness:</b> they price in ${n.dispatcher.reloadAware[0]}\xD7 to ${n.dispatcher.reloadAware[1]}\xD7 of the empty run out of a destination.`,`<b>Foresight:</b> how far ahead on the season curves they look, from not at all to ${n.dispatcher.foresightDays[1]} days.`,`<b>Span:</b> how many trucks they can run. You can run ${n.owner.span}, and a hired dispatcher ${n.dispatcher.span[0]}\u2013${n.dispatcher.span[1]}. Past the team's span, some trucks sit out each round.`])+V("<b>You can always beat the best of them by hand.</b> You see everything they see, including exact ceilings, reload odds and every market's season a year out, and you aren't held to their rules or their mistakes. Learn the market and you'll out-earn any hire.")},{id:"drivers",title:"Drivers",html:V("Every truck needs a driver. You drive your first one, and you hire the rest. Skill runs from 1 to 5 stars and moves real money:")+Be([`fuel economy \xB1${me(n.driver.mpgRange/2)}, maintenance and breakdowns \xB1${me(n.driver.maintRange/2)}, speed \xB1${me(n.driver.mphRange/2)};`,`crash odds from \xD7${n.driver.crash[0]} for a green driver down to \xD7${n.driver.crash[1]} for a veteran.`])+V(`Market pay runs ${n.driver.payPerMile[0].toFixed(2)}\u2013${n.driver.payPerMile[1].toFixed(2)} FD/mi by skill, times a wage index that rises when the driver pool runs thin. Drivers get better with every mile, up to their own potential, and as they do the market pays them more. Give them the raise, or someone else will.`)+V(`<b>Teams:</b> with a co-driver a truck can legally run ${o.hos.teamHours} hours a day. Each driver earns ${me(n.driver.teamPayShare)} of their rate on every mile.`)},{id:"staff",title:"Hiring, poaching and keeping people",html:Be(["<b>Hire</b> from the pool at their asking pay or more. Auto-staff (on by default) fills empty seats with the best value it can find, and hires a dispatcher once you outgrow your span.","<b>Morale</b> follows pay against the market most of all, then tenure, a worn-out truck, a bad safety rating, and being made to run outside the rules, which good drivers hate most.",`<b>Quitting:</b> unhappy people quit. A driver left without a truck walks after ${n.morale.unseatedWeeks} weeks.`,`<b>Poaching:</b> anyone working elsewhere will move for a raise of ${me(n.morale.loyalty[0])} (miserable) to ${me(n.morale.loyalty[1])} (happy) over their pay. Their employer has ${n.morale.noticeDays} days to match. Offers on your people show up on the Staff tab.`,`Dispatchers draw a weekly salary (${Ht(n.dispatcher.payPerWeek[0])}\u2013${Ht(n.dispatcher.payPerWeek[1])} FD by skill) and learn with every load they book.`])},{id:"safety",title:"Safety, inspections and ratings",html:V("Your company has a safety record like a real carrier's, scored in four areas: hours of service, unsafe driving, vehicle maintenance and crashes. Violations count most for six months and drop off after two years. A score over its threshold is an <b>alert</b>.")+Be(["Trucks pass weigh stations on the main corridors, and police make traffic stops. A clean record gets waved through most of the time; alerts, a poor rating or a brand-new authority get pulled in far more.","Inspections can put a driver or a truck <b>out of service</b> on the spot, with fines and roadside repairs.",`A <b>compliance review</b> follows the new-entrant audit at ${o.review.newEntrantDay} days, a run of alerts, or a serious crash. It rates you <i>satisfactory</i>, <i>conditional</i> or <i>unsatisfactory</i>. Conditional raises insurance \xD7${o.insurance.conditional} and shuts you out of strict brokers. Unsatisfactory raises it \xD7${o.insurance.unsatisfactory} and gives you ${o.review.rereviewDays.unsatisfactory} days to clean up before your authority is revoked.`])},{id:"crashes",title:"Crashes",html:V("A crash costs according to why it happened.")+Be(["<b>Not at fault:</b> the other side's insurer pays. You lose the load and time in the shop.",`<b>At fault:</b> your insurer pays up to ${Ht(o.crash.insuranceLimitFd)} FD. You pay the ${Ht(o.crash.deductibleFd)} FD deductible, anything over the limit, and higher premiums afterwards. A verdict the company can't pay winds it up.`,`<b>With violations behind it</b> (fatigue, speeding, bad equipment), juries multiply the verdict ${o.crash.negligenceMult[0]}\u2013${o.crash.negligenceMult[1]}\xD7.`,"<b>A fatal crash caused by falsified hours or known defects is a crime.</b> The authority is revoked, everything the company has is seized, the owner is barred for a year, and the people who ran the truck that way go to jail."])},{id:"shutdowns",title:"Shutdowns",html:V("A revoked authority means the fleet is sold off, the staff are let go, Miles are forfeited, and the account can't file for new authority until its bar runs out:")+Be([`Unsatisfactory rating: ${o.bars.unsatisfactory} days; a second revocation: ${o.bars.imminentHazard} days.`,`A fatal crash from willful violations is a crime: everything seized and a ${o.bars.criminal}-day bar. After ${o.permanentAfterCrimes} crimes the account is barred for good.`])+V("After the bar you file again and start over on a lease. Brokers can see the old revocation.")},{id:"vetting",title:"Vetting",html:V("Brokers and shippers choose who may haul their freight, and so can you, for freight you post:")+Be(["<b>Open:</b> anyone. More bidders and lower rates, more risk.",`<b>Standard:</b> authority at least ${a.vetting.standard.minAuthorityDays} days old, no open claims, not rated unsatisfactory.`,`<b>Strict:</b> at least ${a.vetting.strict.minAuthorityDays} days and ${a.vetting.strict.minDelivered} loads delivered (or a year old), no conditional rating or alerts, no revocation in the past year, and tracking on the load.`])+V("Hot loads are at least standard. A new carrier starts on open freight and earns its way up.")},{id:"money",title:"Money: FD, Miles and the token",html:V("Freight Dollars (FD) are the game's money. Fines, judgments, insurance, wages and repairs take FD out of the economy; freight brings it in. Miles are points earned by delivering, worth more for on-time loads, good margins and a long record.")+V(`The first ${e.token.betaYears} game years are the beta. Then FD launches on the exchange and Miles turn into an airdrop. A revoked company forfeits its Miles and its airdrop.`)}]}var dr={version:"0.9.0-phase0.13",time:{gameMinutesPerDay:1440,realHoursPerGameDayLive:6,daysPerSeason:365,daysPerMonth:30,boardRoundHours:[6,18],simRealMsPerGameDay:6e4},hos:{drivingHoursPerDay:11,avgMph:50,dutyDayHours:24},dwell:{loadMinutes:[60,120],unloadMinutes:[60,120]},map:{maxLaneMiles:1500,minLaneMiles:60,circuity:1.2,nearbyRadiusMi:150},board:{scoreWeights:{price:.55,reputation:.25,deadhead:.2},deadheadScaleMi:150,reloadDeadheadMi:60,reloadDeadheadClamp:[20,250],reloadWeight:1,rolloverCeilingStep:.05,npcFallbackAfterRounds:2,npcFallbackRateOfRef:.95,maxBidsPerTruckPerRound:12,freeStandingOrders:5,posterFeePct:.03},freight:{npcBrokerOnlyShare:.5,baseLoadsPerRound:420,equipmentShare:{van:.6,reefer:.22,flatbed:.18},destDistanceDecayMi:900,inboundPull:.5,deliverySlackMinutes:720,earlyThresholdMinutes:720},rates:{baseRatePerMile:2.45,shortHaulBonus:120,ratioExponent:.35,ratioClamp:[.5,2.5],equipmentPremium:{van:1,reefer:1.18,flatbed:1.12},npcCeilingMarkup:1.15,seasons:{refRpm:{van:2.3,reefer:2.6},flatbedFromVan:.8,volumeGain:3,rateGain:2.5,volumeClamp:[.5,2.5],rateClamp:[.7,1.6],lateDecVolume:.8},reloadExponent:.2,reloadClamp:[.8,1.3],reloadSmoothingRounds:14,sectorClamp:[.85,1.15]},fuel:{baseFd:4,realStrength:.5,clamp:[.75,1.25],surchargePassThrough:.8,surchargeMpg:6.5},costs:{driverWagePerMile:.75,insurancePerLoadedMile:.08,npcLeaseShareOfGross:.15,idleFeeAfterDays:7,idleFeePerDay:50},tractors:{workhorse:{mpg:6.5,maintPerMile:.15,breakdownMult:1,pocCap:1200},highwayPro:{mpg:7.2,maintPerMile:.14,breakdownMult:.7,pocCap:500},flagship:{mpg:7.8,maintPerMile:.13,breakdownMult:.5,pocCap:100}},trailers:{van:{maintPerMile:.03,pocCap:1e3},reefer:{maintPerMile:.06,pocCap:400},flatbed:{maintPerMile:.03,pocCap:300}},dealerFd:{tractor:{workhorse:14e3,highwayPro:32e3,flagship:7e4},trail
